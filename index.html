<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVMap — Metroidvania Map Editor</title>
  </head>
  <body>
    <div id="app">
      <!-- ── Top bar ───────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand"><span class="brand-mark">▚</span> MVMap</div>
        <input id="map-name" class="map-name" type="text" spellcheck="false" aria-label="Map name" />
        <div class="topbar-group">
          <button id="btn-undo" class="tb" title="Undo (Ctrl+Z)">↶</button>
          <button id="btn-redo" class="tb" title="Redo (Ctrl+Shift+Z)">↷</button>
        </div>
        <div class="spacer"></div>
        <div class="topbar-group">
          <button id="btn-maps" class="tb">Maps…</button>
          <button id="btn-new" class="tb">New</button>
          <button id="btn-import" class="tb">Import</button>
          <button id="btn-export" class="tb">Export</button>
          <button id="btn-png" class="tb">PNG</button>
          <button id="btn-help" class="tb" title="Help &amp; shortcuts">?</button>
        </div>
        <span id="save-status" class="save-status"></span>
      </header>

      <!-- ── Left rail ─────────────────────────────────────────────── -->
      <aside class="panel panel-left">
        <div class="tools" id="tools">
          <button class="tool" data-tool="select"><span class="glyph">➤</span><span>Select</span><span class="kb">V</span></button>
          <button class="tool" data-tool="paint"><span class="glyph">▩</span><span>Paint</span><span class="kb">B</span></button>
          <button class="tool" data-tool="rect"><span class="glyph">▭</span><span>Rect</span><span class="kb">R</span></button>
          <button class="tool" data-tool="erase"><span class="glyph">◌</span><span>Erase</span><span class="kb">E</span></button>
          <button class="tool" data-tool="door"><span class="glyph">╫</span><span>Door</span><span class="kb">D</span></button>
          <button class="tool" data-tool="key"><span class="glyph">✦</span><span>Key</span><span class="kb">K</span></button>
          <button class="tool" data-tool="pan"><span class="glyph">✥</span><span>Pan</span><span class="kb">H</span></button>
          <div class="tools-sep">Structures</div>
          <button class="tool" data-tool="spaint" title="Structure paint (S)"><span class="glyph">▦</span><span>S-Paint</span><span class="kb">S</span></button>
          <button class="tool" data-tool="srect" title="Structure rectangle (T)"><span class="glyph">▣</span><span>S-Rect</span><span class="kb">T</span></button>
          <button class="tool" data-tool="serase" title="Structure erase (X)"><span class="glyph">⌫</span><span>S-Erase</span><span class="kb">X</span></button>
          <button class="tool" data-tool="edge" title="Edge structure (P)"><span class="glyph">━</span><span>Edge</span><span class="kb">P</span></button>
          <button class="tool" data-tool="stamp" title="Emoji stamp (M)"><span class="glyph">☺</span><span>Stamp</span><span class="kb">M</span></button>
          <button class="tool" data-tool="note" title="Note (N)"><span class="glyph">✎</span><span>Note</span><span class="kb">N</span></button>
          <div class="tools-sep">Pencil</div>
          <button class="tool" data-tool="pencil" title="Pencil (L)"><span class="glyph">✏</span><span>Pencil</span><span class="kb">L</span></button>
          <button class="tool" data-tool="perase" title="Pencil eraser (Q)"><span class="glyph">⌧</span><span>P-Erase</span><span class="kb">Q</span></button>
        </div>
        <div class="snap-bar" title="Snap step for structures, edge structures, stamps, notes and keys — hold Alt to toggle">
          <div class="snap-head"><span>Snap</span><span class="snap-alt" id="snap-alt" hidden>Alt</span></div>
          <div class="seg snap-steps" id="snap-steps"></div>
        </div>

        <section class="sect">
          <div class="sect-head">
            <h3>Areas</h3>
            <button class="mini" id="btn-add-area" title="New area">+</button>
          </div>
          <div id="area-list" class="area-list"></div>
        </section>

        <section class="sect grow">
          <div class="sect-head">
            <h3>Rooms</h3>
            <span class="count" id="room-count">0</span>
            <button class="mini" id="btn-add-room" title="New room">+</button>
          </div>
          <div id="room-list" class="list"></div>
        </section>

        <section class="sect grow">
          <div class="sect-head">
            <h3>Structures</h3>
            <span class="count" id="struct-count">0</span>
            <button class="mini" id="btn-add-struct" title="New structure">+</button>
          </div>
          <div id="struct-list" class="list"></div>
        </section>

        <section class="sect grow">
          <div class="sect-head">
            <h3>Edge structures</h3>
            <span class="count" id="edge-count">0</span>
            <button class="mini" id="btn-add-edge" title="New edge structure">+</button>
          </div>
          <div id="edge-list" class="list"></div>
        </section>

        <section class="sect grow">
          <div class="sect-head">
            <h3>Stamps</h3>
            <span class="count" id="stamp-count">0</span>
            <button class="mini" id="btn-add-stamp" title="New emoji stamp">+</button>
          </div>
          <div id="stamp-list" class="list"></div>
        </section>

      </aside>

      <!-- ── Stage ─────────────────────────────────────────────────── -->
      <main class="stage">
        <canvas id="world"></canvas>
        <div class="hud">
          <span id="hud-coord">0, 0</span>
          <span class="sep">·</span>
          <span id="hud-zoom">100%</span>
          <button class="mini wide" id="btn-fit" title="Zoom to fit (F)">fit</button>
        </div>
        <div class="hint" id="hint"></div>
        <div class="pencil-bar" id="pencil-bar" hidden>
          <span class="pb-title" id="pb-title">Pencil</span>
          <span class="pb-colors" id="pb-colors"></span>
          <input type="color" id="pb-color" title="Custom colour" />
          <label class="pb-size"><span id="pb-size-label">Size</span>
            <input type="range" id="pb-size" min="1" max="40" step="1" />
            <span class="pb-val" id="pb-size-val"></span>
          </label>
          <button class="mini wide" id="pb-clear" title="Remove every pencil stroke on this map (undoable)">Clear all</button>
        </div>
      </main>

      <!-- ── Right rail ────────────────────────────────────────────── -->
      <aside class="panel panel-right">
        <section class="sect">
          <div class="sect-head"><h3>Inspector</h3></div>
          <div id="inspector" class="inspector"></div>
        </section>

        <section class="sect grow">
          <div class="sect-head">
            <h3>Locks</h3>
            <button class="mini" id="btn-add-lock" title="New lock">+</button>
          </div>
          <div id="lock-list" class="list"></div>
        </section>

        <section class="sect grow">
          <div class="sect-head">
            <h3>Keys</h3>
            <span class="count" id="key-count">0</span>
          </div>
          <div id="key-list" class="list"></div>
        </section>

        <section class="sect">
          <div class="sect-head"><h3>Options</h3></div>
          <label class="check"><input type="checkbox" id="chk-flow" /><span>Show all lock ↔ key links</span></label>
          <label class="check"><input type="checkbox" id="chk-labels" checked /><span>Show room names</span></label>
          <label class="check"><input type="checkbox" id="chk-structs" checked /><span>Show structures</span></label>
          <label class="check"><input type="checkbox" id="chk-slabels" checked /><span>Show structure names</span></label>
          <label class="check"><input type="checkbox" id="chk-notes" checked /><span>Show notes</span></label>
          <label class="check"><input type="checkbox" id="chk-pencil" checked /><span>Show pencil drawings</span></label>
          <label class="check" title="Fade everything except the structures, edges and stamps the UE importer leaves for hand placement (manual or 未分类)"
            ><input type="checkbox" id="chk-manual" /><span>Highlight hand-placed only</span></label
          >
          <label class="inline opt-row" title="Stamp names appear once the map is zoomed in further than this">Stamp labels above zoom
            <span class="num-wrap"><input type="number" id="num-stampzoom" min="10" max="800" step="5" value="60" />%</span>
          </label>
          <label class="inline opt-row" title="What the right mouse button does on the map and in grey-box">Right-click
            <select id="sel-rclick">
              <option value="remove">Remove</option>
              <option value="pan">Hold &amp; drag to pan</option>
            </select>
          </label>
        </section>
      </aside>
    </div>

    <!-- ── Greybox overlay ─────────────────────────────────────────── -->
    <div id="detail" class="overlay" hidden>
      <div class="detail-bar">
        <button class="tb" id="detail-close">← Map</button>
        <strong id="detail-title">Room</strong>
        <div class="detail-tools" id="detail-tools">
          <button class="tool sm" data-dtool="box"><span class="glyph">▭</span>Box<span class="kb">B</span></button>
          <button class="tool sm" data-dtool="select"><span class="glyph">➤</span>Select<span class="kb">V</span></button>
          <button class="tool sm" data-dtool="erase"><span class="glyph">◌</span>Erase<span class="kb">E</span></button>
          <button class="tool sm" data-dtool="pan"><span class="glyph">✥</span>Pan<span class="kb">H</span></button>
        </div>
        <div class="detail-types" id="detail-types"></div>
        <div class="spacer"></div>
        <label class="inline"
          >Subdiv
          <select id="detail-sub">
            <option value="4">4×</option>
            <option value="8">8×</option>
            <option value="16">16×</option>
          </select>
        </label>
        <button class="tb" id="detail-fit">fit</button>
      </div>
      <div class="detail-stage">
        <canvas id="detail-canvas"></canvas>
        <div class="detail-inspector" id="detail-inspector" hidden></div>
      </div>
    </div>

    <div id="modal" class="modal-backdrop" hidden><div class="modal" id="modal-box"></div></div>
    <div id="file-note">
      Running from <code>file://</code> — using localStorage instead of IndexedDB. Export often.
    </div>
    <input type="file" id="file-input" accept="application/json,.json" hidden />
    <input type="file" id="keys-input" accept="application/json,.json" hidden />

    <!-- shared with the UE whitebox importer and the node tests; loaded as classic scripts before the app -->
    <script src="mvmap-types.js"></script>
    <script src="mvmap-ue.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
