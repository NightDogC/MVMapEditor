<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVMap — Metroidvania Map Editor</title>
    <style>
      /* ══════════════════════════════════════════════════════════════
         Theme
         ══════════════════════════════════════════════════════════════ */
      :root {
        --bg: #12151b;
        --bg-2: #171b23;
        --bg-3: #1e232d;
        --line: #2a3140;
        --line-2: #384154;
        --tx: #d7dde8;
        --tx-dim: #8b95a7;
        --tx-mute: #626c7e;
        --acc: #5aa9f0;
        --acc-2: #2b6fae;
        --danger: #e0555f;
        --ok: #3fb27f;
        --radius: 6px;
        --font: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font: 13px/1.45 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      /* ══════════════════════════════════════════════════════════════
         Layout
         ══════════════════════════════════════════════════════════════ */
      #app {
        display: grid;
        grid-template-columns: 224px 1fr 274px;
        grid-template-rows: 42px 1fr;
        height: 100vh;
      }

      .topbar {
        grid-column: 1 / 4;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        background: var(--bg-2);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-weight: 650;
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #eaf0fa;
        user-select: none;
      }
      .brand-mark {
        color: var(--acc);
        font-size: 15px;
      }
      .map-name {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 4px 9px;
        width: 210px;
        outline: none;
      }
      .map-name:focus {
        border-color: var(--acc-2);
      }
      .spacer {
        flex: 1;
      }
      .topbar-group {
        display: flex;
        gap: 4px;
      }
      .tb {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 4px 9px;
        color: var(--tx-dim);
        line-height: 1.3;
      }
      .tb:hover {
        background: #262d39;
        color: var(--tx);
        border-color: var(--line-2);
      }
      .tb:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .tb:disabled:hover {
        background: var(--bg-3);
        color: var(--tx-dim);
        border-color: var(--line);
      }
      .save-status {
        font-size: 11px;
        color: var(--tx-mute);
        min-width: 52px;
        text-align: right;
        user-select: none;
      }
      .save-status.dirty {
        color: #c9a227;
      }

      .panel {
        background: var(--bg-2);
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }
      .panel-left {
        border-right: 1px solid var(--line);
      }
      .panel-right {
        border-left: 1px solid var(--line);
      }

      .sect {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        flex: none;
      }
      .sect.grow {
        flex: 1 1 auto;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sect-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .sect-head h3 {
        flex: 1;
      }
      .sect-head h3 {
        margin: 0;
        font-size: 10.5px;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: var(--tx-mute);
        font-weight: 650;
      }
      .count {
        font-size: 10.5px;
        color: var(--tx-mute);
        font-variant-numeric: tabular-nums;
      }
      .mini {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 4px;
        width: 20px;
        height: 20px;
        line-height: 1;
        padding: 0;
        color: var(--tx-dim);
        font-size: 13px;
      }
      .mini:hover {
        color: var(--tx);
        border-color: var(--line-2);
      }
      .mini.wide {
        width: auto;
        padding: 0 8px;
        font-size: 11px;
      }

      /* ── Tools ─────────────────────────────────────────────────── */
      .tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      .tool {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 6px 7px;
        color: var(--tx-dim);
        font-size: 11.5px;
        text-align: left;
      }
      .tool .glyph {
        font-size: 13px;
        width: 14px;
        text-align: center;
      }
      .tool:hover {
        color: var(--tx);
        border-color: var(--line-2);
      }
      .tool.on {
        background: #21344a;
        border-color: var(--acc-2);
        color: #cfe6ff;
      }
      .tool.sm {
        padding: 4px 8px;
        font-size: 11.5px;
      }
      .tool .kb {
        margin-left: auto;
        font: 10px/1 var(--mono);
        color: var(--tx-mute);
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 4px;
      }
      .tool.sm .kb {
        margin-left: 6px;
      }
      .tool.on .kb {
        color: #cfe6ff;
        border-color: var(--acc-2);
        background: #1a2a3c;
      }
      .ord {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .ord button {
        flex: 1;
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 2px 0;
        font-size: 12px;
        color: var(--tx-dim);
      }
      .ord button:hover:not(:disabled) {
        color: var(--tx);
        border-color: var(--line-2);
      }
      .ord button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .ord .pos {
        flex: 1.4;
        text-align: center;
        font-size: 11px;
        color: var(--tx-mute);
        font-variant-numeric: tabular-nums;
      }
      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 3px;
        max-height: 148px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .emoji-grid button {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 0;
        font-size: 15px;
        line-height: 1.2;
      }
      .emoji-grid button.on {
        border-color: var(--acc);
        background: #21344a;
      }
      .emo {
        width: 14px;
        text-align: center;
        flex: none;
        font-size: 12px;
      }
      .rclick-row {
        padding: 5px 2px 1px;
      }
      .rclick-row select {
        flex: 1;
        min-width: 0;
      }
      #i-ntext {
        min-height: 110px;
      }
      .tools-sep {
        grid-column: 1 / -1;
        margin-top: 4px;
        font-size: 10px;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: var(--tx-mute);
        font-weight: 650;
        user-select: none;
      }

      /* ── Lists ─────────────────────────────────────────────────── */
      .list {
        overflow-y: auto;
        flex: 1;
        margin: -2px;
        padding: 2px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 4px 6px;
        border-radius: 5px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .row:hover {
        background: var(--bg-3);
      }
      .row.on {
        background: #21344a;
        border-color: var(--acc-2);
      }
      .row .nm {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sub {
        font-size: 10.5px;
        color: var(--tx-mute);
        font-variant-numeric: tabular-nums;
      }
      .grp {
        padding: 6px 6px 2px;
        font-size: 10px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        font-weight: 650;
      }
      .swatch {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        flex: none;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.45);
      }
      .swatch.rnd {
        border-radius: 50%;
      }
      .empty {
        color: var(--tx-mute);
        font-size: 11.5px;
        padding: 6px 4px;
        font-style: italic;
      }

      .area-list .row {
        padding: 3px 6px;
      }
      .area-list input.nm-edit {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        padding: 0;
        min-width: 0;
      }
      .area-list input.nm-edit:focus {
        background: var(--bg);
        border-radius: 3px;
        padding: 0 3px;
      }

      /* ── Checkboxes ────────────────────────────────────────────── */
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 2px;
        cursor: pointer;
        color: var(--tx-dim);
        font-size: 11.5px;
      }
      .check:hover {
        color: var(--tx);
      }
      .check input {
        accent-color: var(--acc);
        margin: 0;
      }

      /* ── Stage ─────────────────────────────────────────────────── */
      .stage {
        position: relative;
        overflow: hidden;
        background: var(--bg);
      }
      #world,
      #detail-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hud {
        position: absolute;
        left: 10px;
        bottom: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        background: rgba(18, 21, 27, 0.85);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 3px 8px;
        font-size: 11px;
        color: var(--tx-mute);
        font-variant-numeric: tabular-nums;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      .hud .sep {
        opacity: 0.5;
      }
      .hint {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 10px;
        background: rgba(18, 21, 27, 0.85);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 3px 10px;
        font-size: 11px;
        color: var(--tx-mute);
        pointer-events: none;
        backdrop-filter: blur(4px);
        white-space: nowrap;
      }
      .hint kbd {
        font: 10px var(--mono);
        background: var(--bg-3);
        border: 1px solid var(--line-2);
        border-radius: 3px;
        padding: 0 4px;
        color: var(--tx-dim);
      }

      /* ── Inspector ─────────────────────────────────────────────── */
      .inspector {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .fld > label {
        font-size: 10.5px;
        color: var(--tx-mute);
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      .fld input[type="text"],
      .fld select,
      .fld textarea {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 7px;
        outline: none;
        width: 100%;
      }
      .fld input[type="text"]:focus,
      .fld select:focus,
      .fld textarea:focus {
        border-color: var(--acc-2);
      }
      .fld input[type="color"] {
        width: 34px;
        height: 22px;
        padding: 0 2px;
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        cursor: pointer;
      }
      .color-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 4px;
        font-size: 11px;
        color: var(--tx-mute);
      }
      .fld textarea {
        resize: vertical;
        min-height: 48px;
        font: 12px/1.4 var(--font);
      }
      .insp-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 620;
        padding-bottom: 2px;
      }
      .insp-title .kind {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.9px;
        color: var(--tx-mute);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        width: 17px;
        height: 17px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.5);
        padding: 0;
      }
      .chip.on {
        outline: 2px solid var(--tx);
        outline-offset: 1px;
      }
      .seg {
        display: flex;
        gap: 3px;
      }
      .seg button {
        flex: 1;
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 4px;
        font-size: 11px;
        color: var(--tx-dim);
      }
      .seg button.on {
        background: #21344a;
        border-color: var(--acc-2);
        color: #cfe6ff;
      }
      .btn-row {
        display: flex;
        gap: 4px;
      }
      .btn {
        flex: 1;
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 5px;
        color: var(--tx-dim);
        font-size: 11.5px;
      }
      .btn:hover {
        color: var(--tx);
        border-color: var(--line-2);
      }
      .btn.primary {
        background: #21344a;
        border-color: var(--acc-2);
        color: #cfe6ff;
      }
      .btn.danger:hover {
        color: #ffd7d9;
        border-color: var(--danger);
        background: #3a1f22;
      }
      .link-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 150px;
        overflow-y: auto;
      }
      .meta {
        font-size: 11px;
        color: var(--tx-mute);
      }

      /* ── Detail overlay ────────────────────────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      .overlay[hidden] {
        display: none;
      }
      .detail-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        height: 42px;
        background: var(--bg-2);
        border-bottom: 1px solid var(--line);
      }
      .detail-tools {
        display: flex;
        gap: 4px;
      }
      .detail-types {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
      }
      .ty {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 11px;
        color: var(--tx-dim);
      }
      .ty.on {
        border-color: var(--tx-dim);
        color: var(--tx);
      }
      .detail-stage {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      .detail-inspector {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 210px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--tx-mute);
      }
      .inline select {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 5px;
        outline: none;
      }

      /* ── Modal ─────────────────────────────────────────────────── */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(6, 8, 12, 0.68);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
      }
      .modal-backdrop[hidden] {
        display: none;
      }
      .modal {
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        width: min(620px, 92vw);
        max-height: 84vh;
        overflow-y: auto;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
      }
      .modal h2 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .modal h3 {
        margin: 16px 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.9px;
        color: var(--tx-mute);
      }
      .modal p {
        color: var(--tx-dim);
        margin: 0 0 9px;
      }
      .modal .close-row {
        display: flex;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .kbd-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        font-size: 12px;
        color: var(--tx-dim);
      }
      .keymap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 14px;
      }
      .keymap .km-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--tx-dim);
      }
      .keymap .km-row span {
        flex: 1;
      }
      .keycap {
        min-width: 30px;
        font: 11px var(--mono);
        color: var(--tx);
        background: var(--bg-3);
        border: 1px solid var(--line-2);
        border-radius: 4px;
        padding: 2px 7px;
      }
      .keycap:hover {
        border-color: var(--acc-2);
      }
      .keycap.wait {
        background: #21344a;
        border-color: var(--acc);
        color: #cfe6ff;
      }
      .keycap.flash {
        border-color: var(--ok);
      }
      .km-msg {
        min-height: 18px;
        margin-top: 6px;
      }
      .km-msg.err {
        color: #e0a13a;
      }
      .kbd-grid b {
        font: 11px var(--mono);
        color: var(--tx);
        background: var(--bg-3);
        border: 1px solid var(--line-2);
        border-radius: 3px;
        padding: 0 5px;
        justify-self: start;
      }
      .map-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 5px;
      }
      .map-row .nm {
        flex: 1;
      }
      .map-row .sub {
        font-size: 11px;
        color: var(--tx-mute);
      }

      /* ── file:// notice ────────────────────────────────────────── */
      #file-note {
        position: fixed;
        z-index: 70;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        background: #3a2f18;
        border: 1px solid #6b5620;
        color: #f0dfae;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11.5px;
        display: none;
      }
      #file-note.show {
        display: block;
      }

      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2e3644;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a4454;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <!-- ── Top bar ───────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand"><span class="brand-mark">▚</span> MVMap</div>
        <input id="map-name" class="map-name" type="text" spellcheck="false" aria-label="Map name" />
        <div class="topbar-group">
          <button id="btn-undo" class="tb" title="Undo (Ctrl+Z)">↶</button>
          <button id="btn-redo" class="tb" title="Redo (Ctrl+Shift+Z)">↷</button>
        </div>
        <div class="spacer"></div>
        <div class="topbar-group">
          <button id="btn-maps" class="tb">Maps…</button>
          <button id="btn-new" class="tb">New</button>
          <button id="btn-import" class="tb">Import</button>
          <button id="btn-export" class="tb">Export</button>
          <button id="btn-png" class="tb">PNG</button>
          <button id="btn-help" class="tb" title="Help &amp; shortcuts">?</button>
        </div>
        <span id="save-status" class="save-status"></span>
      </header>

      <!-- ── Left rail ─────────────────────────────────────────────── -->
      <aside class="panel panel-left">
        <div class="tools" id="tools">
          <button class="tool" data-tool="select"><span class="glyph">➤</span><span>Select</span><span class="kb">V</span></button>
          <button class="tool" data-tool="paint"><span class="glyph">▩</span><span>Paint</span><span class="kb">B</span></button>
          <button class="tool" data-tool="rect"><span class="glyph">▭</span><span>Rect</span><span class="kb">R</span></button>

    <script>
      "use strict";
      (function () {
        /* ══════════════════════════════════════════════════════════════
           1 · Utilities
           ══════════════════════════════════════════════════════════════ */
        const $ = (s) => document.querySelector(s);
        const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const ck = (x, y) => x + "," + y;
        const unck = (s) => {
          const i = s.indexOf(",");
          return [+s.slice(0, i), +s.slice(i + 1)];
        };
        const esc = (s) =>
          String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function hexA(hex, a) {
          const h = hex.replace("#", "");
          const n = parseInt(h.length === 3 ? h.replace(/./g, "$&$&") : h, 16);
          return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
        }
        function shade(hex, amt) {
          const h = hex.replace("#", "");
          const n = parseInt(h.length === 3 ? h.replace(/./g, "$&$&") : h, 16);
          const f = (v) => clamp(Math.round(v + 255 * amt), 0, 255);
          return `rgb(${f((n >> 16) & 255)},${f((n >> 8) & 255)},${f(n & 255)})`;
        }
        function saveBlob(blob, filename) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
        const slug = (s) => (s || "map").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "map";

        /* ══════════════════════════════════════════════════════════════
           2 · Constants
           ══════════════════════════════════════════════════════════════ */
        const CELL = 32; // world px per grid cell
        const DCELL = 22; // detail px per sub-cell
        const MAJOR = 8; // heavy grid line every N cells

        const AREA_COLORS = [
          "#4c8dd8", "#3fb27f", "#d8734c", "#a56fd0", "#d8b64c",
          "#4cc9d8", "#d84c7a", "#6ad84c", "#8b93a6", "#d85c5c",
        ];
        const LOCK_COLORS = [
          "#e0555f", "#f0a13a", "#f0dc3a", "#5ad07a", "#5aa9f0",
          "#a97af0", "#ef6fb5", "#5fd8cf", "#c9885a", "#9aa4b5",
        ];
        const STRUCT_COLORS = [
          "#b8c0cc", "#7c879b", "#c9885a", "#e0555f", "#f0a13a", "#f0dc3a",
          "#5ad07a", "#5fd8cf", "#5aa9f0", "#a97af0", "#ef6fb5", "#d84c7a",
        ];
        const NOTE_COLORS = ["#f0dc3a", "#f0a13a", "#ef6fb5", "#5ad07a", "#5fd8cf", "#5aa9f0", "#a97af0", "#e6ecf6"];
        const NOTE_BOX_W = 236; // expanded note width, in screen px at any zoom
        const STAMP_EMOJI = [
          "⭐", "💎", "❤️", "🗝️", "💀", "👾", "🔥", "💧",
          "⚡", "🌀", "🪜", "📦", "🧱", "⚙️", "🔒", "🚪",
          "💾", "🛏️", "🛒", "👑", "🏁", "❓", "❗", "🕳️",
          "❄️", "💥", "💨", "💦", "⛔", "🚫", "☢️", "⚠️",
          "❌", "⭕", "‼️", "⁉️", "🍔", "🎁", "💰", "🏆",
          "🩸", "💊", "🛡️", "💣", "⚔️", "😈", "🎲", "🪄",
          "🎵", "🪽", "✈️", "🛗", "🛖", "📖", "🎞️", "👤",
          "🎯", "🏞️", "➡️", "⬅️", "⬆️", "⬇️", "☯️", "🐍",
        ];
        const graphemes = (str) =>
          typeof Intl !== "undefined" && Intl.Segmenter
            ? Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(str), (g) => g.segment)
            : Array.from(str);
        const isEmoji = (g) => /\p{Extended_Pictographic}|\p{Regional_Indicator}|\u20E3/u.test(g);
        /** The single emoji to keep from a text field's value: the most recently typed one, or null. */
        function pickEmoji(str) {
          const gs = graphemes(str || "").filter(isEmoji);
          return gs.length ? gs[gs.length - 1] : null;
        }
        const BOX_TYPES = [
          { id: "solid", name: "Solid", color: "#7c879b" },
          { id: "platform", name: "Platform", color: "#3fb27f" },
          { id: "hazard", name: "Hazard", color: "#e0555f" },
          { id: "water", name: "Water", color: "#4cc9d8" },
          { id: "ladder", name: "Ladder", color: "#f0a13a" },
          { id: "exit", name: "Exit", color: "#a56fd0" },
          { id: "item", name: "Item", color: "#f0dc3a" },
          { id: "enemy", name: "Enemy", color: "#d84c7a" },
          { id: "note", name: "Note", color: "#8b93a6" },
        ];
        const boxType = (id) => BOX_TYPES.find((t) => t.id === id) || BOX_TYPES[0];
        const FONTF = `ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif`;

        const HINTS = {
          select: "Click to select · drag a room to move it · double-click a room to grey-box it · <kbd>Del</kbd> removes",
          paint: "Drag to paint cells into the active room · <kbd>Alt</kbd> erases · <kbd>Shift</kbd> starts a new room",
          rect: "Drag a rectangle to fill cells into the active room · <kbd>Alt</kbd> clears the rectangle",
          erase: "Drag over cells to remove them from their room",
          door: "Click a cell edge to place a door · click an existing door to edit it · <kbd>Alt</kbd>-click removes",
          key: "Click a cell to drop a key marker there",
          pan: "Drag to pan · scroll to zoom · <kbd>F</kbd> zooms to fit",
          spaint: "Drag to paint cells into the active structure · <kbd>Alt</kbd> erases · <kbd>Shift</kbd> starts a new structure",
          srect: "Drag a rectangle to fill the active structure · <kbd>Alt</kbd> clears it · <kbd>Shift</kbd> starts a new structure",
          serase: "Drag over cells to remove structure cells — rooms underneath are untouched",
          note: "Click a cell to add a note · click a note to select it · its <kbd>+</kbd> button expands it · <kbd>Alt</kbd>-click removes",
          stamp: "Click a cell to drop the active emoji stamp · <kbd>Alt</kbd>-click removes · <kbd>Shift</kbd> starts a new stamp",
          edge: "Drag along grid lines to draw an edge structure · click an edge to add or select · <kbd>Alt</kbd> removes · <kbd>Shift</kbd> starts a new one",
        };

        /** Tools on the left panel, in panel order — their shortcuts are user-configurable. */
        const TOOL_LIST = [
          { id: "select", name: "Select / move" },
          { id: "paint", name: "Paint cells" },
          { id: "rect", name: "Rectangle fill" },
          { id: "erase", name: "Erase cells" },
          { id: "door", name: "Door" },
          { id: "key", name: "Key" },
          { id: "pan", name: "Pan" },
          { id: "spaint", name: "Structure paint" },
          { id: "srect", name: "Structure rectangle" },
          { id: "serase", name: "Structure erase" },
          { id: "edge", name: "Edge structure" },
          { id: "stamp", name: "Emoji stamp" },
          { id: "note", name: "Note" },
        ];
        const DEFAULT_TOOL_KEYS = {
          select: "v", paint: "b", rect: "r", erase: "e", door: "d", key: "k", pan: "h",
          spaint: "s", srect: "t", serase: "x", edge: "p", stamp: "m", note: "n",
        };
        /** Keys the map view already uses for something else; a tool can't take them. */
        const RESERVED_KEYS = {
          " ": "Space — hold to pan",
          f: "F — zoom to fit",
          enter: "Enter — grey-box the selected room",
          escape: "Esc — deselect",
          delete: "Del — delete selection",
          backspace: "Backspace — delete selection",
          "[": "[ — move selection up",
          "]": "] — move selection down",
          tab: "Tab — keyboard focus",
        };

        /* ══════════════════════════════════════════════════════════════
           3 · Document model
           ══════════════════════════════════════════════════════════════ */
        // doc.rooms[]  { id, name, areaId, color|null, notes, cells:["x,y",…] }
        // doc.doors[]  { id, x, y, o:"v"|"h", kind:"passage"|"door"|"oneway", dir:1|-1, lockId|null }
        //              a "v" edge at (x,y) divides cells (x-1,y) | (x,y)
        //              an "h" edge at (x,y) divides cells (x,y-1) / (x,y)
        // doc.locks[]  { id, name, color, keyIds:[] }
        // doc.keys[]   { id, name, color, x, y }
        // doc.detail{}  roomId -> { sub, boxes:[{id,x,y,w,h,type,label}] }  coords in sub-cells, absolute
        // doc.structures[]  { id, name, color, notes, cells:["x,y",…] }   a layer drawn over rooms
        // doc.edgeStructs[] { id, name, color, notes, edges:["o:x,y",…] } same edge convention as doors
        // doc.stamps[]      { id, name, emoji, color, notes, cells:["x,y",…] } one emoji per cell, drawn on top
        // doc.notes[]       { id, name, text, color, x, y, expanded } a standalone annotation on one cell, above stamps
        //   rooms/structures/edgeStructs/stamps/keys may carry hideName:true to hide their map label
        function newDoc(name) {
          const a = { id: uid("area"), name: "Area 1", color: AREA_COLORS[0] };
          return {
            id: uid("map"),
            version: 1,
            name: name || "Untitled Map",
            updated: Date.now(),
            areas: [a],
            rooms: [],
            doors: [],
            locks: [],
            keys: [],
            detail: {},
            structures: [],
            edgeStructs: [],
            stamps: [],
            notes: [],
          };
        }

        /** Normalise anything loaded from disk/db so missing fields can't crash the editor. */
        function migrate(d) {
          const base = newDoc();
          d = Object.assign({}, base, d || {});
          d.areas = Array.isArray(d.areas) && d.areas.length ? d.areas : base.areas;
          d.rooms = Array.isArray(d.rooms) ? d.rooms : [];
          d.doors = Array.isArray(d.doors) ? d.doors : [];
          d.locks = Array.isArray(d.locks) ? d.locks : [];
          d.keys = Array.isArray(d.keys) ? d.keys : [];
          d.detail = d.detail && typeof d.detail === "object" ? d.detail : {};
          d.rooms.forEach((r) => {
            r.cells = Array.isArray(r.cells) ? r.cells : [];
            if (!d.areas.some((a) => a.id === r.areaId)) r.areaId = d.areas[0].id;
          });
          d.locks.forEach((l) => (l.keyIds = Array.isArray(l.keyIds) ? l.keyIds : []));
          d.structures = Array.isArray(d.structures) ? d.structures : [];
          d.edgeStructs = Array.isArray(d.edgeStructs) ? d.edgeStructs : [];
          d.structures.forEach((s) => {
            s.cells = Array.isArray(s.cells) ? s.cells : [];
            if (typeof s.notes !== "string") s.notes = "";
          });
          d.notes = (Array.isArray(d.notes) ? d.notes : []).filter((n) => n && Number.isFinite(n.x) && Number.isFinite(n.y));
          d.notes.forEach((n) => {
            if (typeof n.name !== "string") n.name = "Note";
            if (typeof n.text !== "string") n.text = "";
            if (!n.color) n.color = NOTE_COLORS[0];
            n.expanded = !!n.expanded;
          });
          d.stamps = Array.isArray(d.stamps) ? d.stamps : [];
          d.stamps.forEach((s) => {
            s.cells = Array.isArray(s.cells) ? s.cells : [];
            if (typeof s.notes !== "string") s.notes = "";
            s.emoji = pickEmoji(String(s.emoji || "")) || STAMP_EMOJI[0];
          });
          d.edgeStructs.forEach((s) => {
            s.edges = Array.isArray(s.edges) ? s.edges : [];
            if (typeof s.notes !== "string") s.notes = "";
          });
          return d;
        }

        /* ══════════════════════════════════════════════════════════════
           4 · Runtime state
           ══════════════════════════════════════════════════════════════ */
        const S = {
          doc: newDoc(),
          cam: { x: 0, y: 0, zoom: 1 },
          tool: "paint",
          sel: null, // {type:"room"|"door"|"key"|"lock"|"struct"|"edge", id}
          activeRoomId: null,
          activeAreaId: null,
          activeStructId: null,
          activeEdgeId: null,
          activeStampId: null,
          showFlow: false,
          showLabels: true,
          showStructs: true,
          showStructLabels: true,
          showNotes: true,
          rclick: "remove", // right mouse button: "remove" (like Alt) | "pan" (hold and drag)
          hoverCell: null,
          hoverEdge: null,
          drag: null,
          spaceDown: false,
          detailRoomId: null,
          dtool: "box",
          dtype: "solid",
          dsel: null,
          dcam: { x: 0, y: 0, zoom: 1 },
          ddrag: null,
        };

        let cellIndex = new Map(); // "x,y" -> roomId
        let doorIndex = new Map(); // "o:x,y" -> door
        let structIndex = new Map(); // "x,y" -> structureId
        let edgeIndex = new Map(); // "o:x,y" -> edgeStructId
        let stampIndex = new Map(); // "x,y" -> stampId
        let needsDraw = true;
        const undoStack = [];
        const redoStack = [];

        function reindex() {
          cellIndex = new Map();
          for (const r of S.doc.rooms) for (const c of r.cells) cellIndex.set(c, r.id);
          doorIndex = new Map();
          for (const d of S.doc.doors) doorIndex.set(d.o + ":" + d.x + "," + d.y, d);
          structIndex = new Map();
          for (const s of S.doc.structures) for (const c of s.cells) structIndex.set(c, s.id);
          edgeIndex = new Map();
          for (const s of S.doc.edgeStructs) for (const e of s.edges) edgeIndex.set(e, s.id);
          stampIndex = new Map();
          for (const s of S.doc.stamps) for (const c of s.cells) stampIndex.set(c, s.id);
        }
        const stampById = (id) => S.doc.stamps.find((s) => s.id === id) || null;
        const noteById = (id) => S.doc.notes.find((n) => n.id === id) || null;
        const noteAtCell = (x, y) => S.doc.notes.find((n) => n.x === x && n.y === y) || null;
        function activeStamp() {
          let s = stampById(S.activeStampId);
          if (!s && S.sel && S.sel.type === "stamp") s = stampById(S.sel.id);
          return s;
        }
        const structById = (id) => S.doc.structures.find((s) => s.id === id) || null;
        const edgeStructById = (id) => S.doc.edgeStructs.find((s) => s.id === id) || null;
        const structColor = (s) => (s && s.color) || STRUCT_COLORS[0];
        const ek = (o, x, y) => o + ":" + x + "," + y;
        const unek = (s) => {
          const [x, y] = unck(s.slice(2));
          return { o: s[0], x, y };
        };
        function activeStruct() {
          let s = structById(S.activeStructId);
          if (!s && S.sel && S.sel.type === "struct") s = structById(S.sel.id);
          return s;
        }
        function activeEdgeStruct() {
          let s = edgeStructById(S.activeEdgeId);
          if (!s && S.sel && S.sel.type === "edge") s = edgeStructById(S.sel.id);
          return s;
        }
        const roomById = (id) => S.doc.rooms.find((r) => r.id === id) || null;
        const areaById = (id) => S.doc.areas.find((a) => a.id === id) || S.doc.areas[0];
        const lockById = (id) => S.doc.locks.find((l) => l.id === id) || null;
        const keyById = (id) => S.doc.keys.find((k) => k.id === id) || null;
        const roomAtCell = (x, y) => roomById(cellIndex.get(ck(x, y)));
        const doorAtEdge = (o, x, y) => doorIndex.get(o + ":" + x + "," + y) || null;
        const roomColor = (r) => (r && (r.color || areaById(r.areaId).color)) || AREA_COLORS[0];

        function activeRoom() {
          let r = roomById(S.activeRoomId);
          if (!r && S.sel && S.sel.type === "room") r = roomById(S.sel.id);

        function setActiveArea(id) {
          S.activeAreaId = id;

        }

        /* ── Undo ──────────────────────────────────────────────────── */
        function snapshot() {
          return JSON.stringify(S.doc);
        }
        function pushUndo() {
          undoStack.push(snapshot());
          if (undoStack.length > 120) undoStack.shift();
          redoStack.length = 0;
        }
        function restore(json) {
          S.doc = migrate(JSON.parse(json));
          if (S.sel && !selExists(S.sel)) S.sel = null;
          if (!roomById(S.activeRoomId)) S.activeRoomId = null;
          if (!structById(S.activeStructId)) S.activeStructId = null;
          if (!edgeStructById(S.activeEdgeId)) S.activeEdgeId = null;
          if (!stampById(S.activeStampId)) S.activeStampId = null;

        function selExists(sel) {

          if (sel.type === "key") return !!keyById(sel.id);
          if (sel.type === "door") return S.doc.doors.some((d) => d.id === sel.id);
          if (sel.type === "struct") return !!structById(sel.id);
          if (sel.type === "edge") return !!edgeStructById(sel.id);

          if (!undoStack.length) return;

        /** Call after every mutation: reindex, redraw, refresh panels, autosave.

        let uiDirty = false;
        function commit(skipSave) {

          if (S.drag || S.ddrag) uiDirty = true;

        /* ══════════════════════════════════════════════════════════════
           5 · Persistence — IndexedDB, falling back to localStorage
           ══════════════════════════════════════════════════════════════ */
        const Store = (function () {
          const DB_NAME = "mvmap";
          const STORE = "maps";
          const LS_KEY = "mvmap:docs";
          let db = null;
          let mode = "idb";

          function openDB() {
            return new Promise((res) => {
              let req;
              try {
                req = indexedDB.open(DB_NAME, 1);
              } catch (e) {
                mode = "ls";
                return res();
              }
              req.onupgradeneeded = () => {
                const d = req.result;
                if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
              };
              req.onsuccess = () => {
                db = req.result;
                mode = "idb";
                res();
              };
              req.onerror = req.onblocked = () => {
                mode = "ls";
                res();
              };
              // Safari/file:// can hang without firing either handler.
              setTimeout(() => {
                if (!db && mode === "idb") {
                  mode = "ls";
                  res();
                }
              }, 1500);
            });
          }
          const lsAll = () => {
            try {
              return JSON.parse(localStorage.getItem(LS_KEY) || "{}");
            } catch (e) {
              return {};
            }
          };
          const lsWrite = (o) => {
            try {
              localStorage.setItem(LS_KEY, JSON.stringify(o));
            } catch (e) {}
          };
          function tx(fn, def) {
            return new Promise((res) => {
              if (mode !== "idb" || !db) return res(fn(null));
              try {
                res(fn(db.transaction(STORE, "readwrite").objectStore(STORE)));
              } catch (e) {
                mode = "ls";
                res(def);
              }
            });
          }
          return {
            get mode() {
              return mode;
            },
            init: openDB,
            put(doc) {
              if (mode === "ls" || !db) {
                const all = lsAll();
                all[doc.id] = doc;
                lsWrite(all);
                return Promise.resolve();
              }
              return tx((st) => {
                if (st) st.put(JSON.parse(JSON.stringify(doc)));
              });
            },
            del(id) {
              if (mode === "ls" || !db) {
                const all = lsAll();
                delete all[id];
                lsWrite(all);
                return Promise.resolve();
              }
              return tx((st) => {
                if (st) st.delete(id);
              });
            },
            all() {
              if (mode === "ls" || !db) return Promise.resolve(Object.values(lsAll()));
              return new Promise((res) => {
                try {
                  const r = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
                  r.onsuccess = () => res(r.result || []);
                  r.onerror = () => res([]);
                } catch (e) {
                  res(Object.values(lsAll()));
                }
              });
            },
          };
        })();

        let saveTimer = null;
        function scheduleSave() {
          setStatus("dirty");
          clearTimeout(saveTimer);
          saveTimer = setTimeout(async () => {
            S.doc.updated = Date.now();
            await Store.put(S.doc);
            try {
              localStorage.setItem("mvmap:last", S.doc.id);
            } catch (e) {}
            setStatus("saved");
          }, 600);
        }
        function setStatus(kind) {
          const el = $("#save-status");
          if (kind === "dirty") {

            el.classList.add("dirty");
          } else {
            el.textContent = "saved";
            el.classList.remove("dirty");
          }
        }

        /* ══════════════════════════════════════════════════════════════
           6 · Geometry helpers
           ══════════════════════════════════════════════════════════════ */
        function roomBBox(room) {
          if (!room || !room.cells.length) return null;
          let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
          for (const c of room.cells) {
            const [x, y] = unck(c);
            if (x < x0) x0 = x;
            if (y < y0) y0 = y;
            if (x > x1) x1 = x;
            if (y > y1) y1 = y;
          }
          return { x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
        }
        function docBBox() {
          let b = null;
          const grow = (x, y) => {
            if (!b) b = { x0: x, y0: y, x1: x, y1: y };
            else {
              b.x0 = Math.min(b.x0, x); b.y0 = Math.min(b.y0, y);
              b.x1 = Math.max(b.x1, x); b.y1 = Math.max(b.y1, y);
            }
          };
          for (const r of S.doc.rooms) for (const c of r.cells) { const [x, y] = unck(c); grow(x, y); }
          for (const k of S.doc.keys) grow(k.x, k.y);
          for (const s of S.doc.structures) for (const c of s.cells) { const [x, y] = unck(c); grow(x, y); }
          for (const s of S.doc.stamps) for (const c of s.cells) { const [x, y] = unck(c); grow(x, y); }
          for (const n of S.doc.notes) grow(n.x, n.y);
          for (const s of S.doc.edgeStructs)
            for (const e of s.edges) {
              for (const [x, y] of edgeCells(unek(e))) grow(x, y);
            }
          return b;
        }
        function cellsBBox(cells) {
          if (!cells.length) return null;
          return roomBBox({ cells });
        }
        /** World-pixel endpoints of an edge. */
        function edgeEnds(e) {
          return e.o === "v"
            ? [e.x * CELL, e.y * CELL, e.x * CELL, (e.y + 1) * CELL]
            : [e.x * CELL, e.y * CELL, (e.x + 1) * CELL, e.y * CELL];
        }
        /** Edge keys covered by a straight drag between two grid vertices. */
        function edgeLine(a, b) {
          const dx = b.x - a.x, dy = b.y - a.y;
          const out = [];
          if (!dx && !dy) return out;
          if (Math.abs(dx) >= Math.abs(dy)) {
            for (let x = Math.min(a.x, b.x); x < Math.max(a.x, b.x); x++) out.push(ek("h", x, a.y));
          } else {
            for (let y = Math.min(a.y, b.y); y < Math.max(a.y, b.y); y++) out.push(ek("v", a.x, y));
          }
          return out;
        }
        const vertexAt = (wx, wy) => ({ x: Math.round(wx / CELL), y: Math.round(wy / CELL) });
        /** Midpoint of a door edge, in world pixels. */
        function edgeMid(d) {
          return d.o === "v"
            ? { x: d.x * CELL, y: d.y * CELL + CELL / 2 }
            : { x: d.x * CELL + CELL / 2, y: d.y * CELL };
        }
        function edgeCells(d) {

        function nearestEdge(wx, wy, tol) {
          tol = tol == null ? 0.28 : tol;
          const fx = wx / CELL, fy = wy / CELL;
          const cx = Math.floor(fx), cy = Math.floor(fy);
          const dx = fx - cx, dy = fy - cy;
          const cands = [
            { o: "v", x: cx, y: cy, d: dx },
            { o: "v", x: cx + 1, y: cy, d: 1 - dx },
            { o: "h", x: cx, y: cy, d: dy },
            { o: "h", x: cx, y: cy + 1, d: 1 - dy },
          ];
          cands.sort((a, b) => a.d - b.d);

        /** Drop doors that no longer touch any room. */
        function pruneDoors() {

            edgeCells(d).some(([x, y]) => cellIndex.has(ck(x, y)))
          );
        }

        /* ══════════════════════════════════════════════════════════════
           7 · Mutations
           ══════════════════════════════════════════════════════════════ */
        function createRoom(areaId) {
          const area = areaById(areaId || S.activeAreaId);
          const n = S.doc.rooms.length + 1;
          const r = { id: uid("room"), name: "Room " + n, areaId: area.id, color: null, notes: "", cells: [] };
          S.doc.rooms.push(r);
          S.activeRoomId = r.id;
          return r;

        function paintCell(x, y, room) {
          const k = ck(x, y);
          const ownerId = cellIndex.get(k);
          if (ownerId === room.id) return false;
          if (ownerId) {
            const owner = roomById(ownerId);
            owner.cells = owner.cells.filter((c) => c !== k);
          }
          room.cells.push(k);
          cellIndex.set(k, room.id);
          return true;
        }
        function eraseCell(x, y) {
          const k = ck(x, y);
          const ownerId = cellIndex.get(k);
          if (!ownerId) return false;
          const owner = roomById(ownerId);
          owner.cells = owner.cells.filter((c) => c !== k);
          cellIndex.delete(k);
          return true;
        }
        /** Remove rooms left with no cells (plus their greybox data). */
        function dropEmptyRooms() {
          const gone = S.doc.rooms.filter((r) => !r.cells.length).map((r) => r.id);
          if (!gone.length) return;
          S.doc.rooms = S.doc.rooms.filter((r) => r.cells.length);
          gone.forEach((id) => {
            delete S.doc.detail[id];

            if (S.detailRoomId === id) closeDetail();

        function deleteRoom(id) {
          const r = roomById(id);
          if (!r) return;
          const cells = new Set(r.cells);
          S.doc.rooms = S.doc.rooms.filter((x) => x.id !== id);
          delete S.doc.detail[id];
          reindex();
          pruneDoors();
          S.doc.keys = S.doc.keys.filter((k) => !cells.has(ck(k.x, k.y)));
          S.doc.locks.forEach((l) => (l.keyIds = l.keyIds.filter((kid) => keyById(kid))));
          if (S.activeRoomId === id) S.activeRoomId = null;
          if (S.sel && S.sel.id === id) S.sel = null;
          if (S.detailRoomId === id) closeDetail();
        }
        function deleteDoor(id) {
          S.doc.doors = S.doc.doors.filter((d) => d.id !== id);
          if (S.sel && S.sel.id === id) S.sel = null;
        }
        function deleteKey(id) {
          S.doc.keys = S.doc.keys.filter((k) => k.id !== id);
          S.doc.locks.forEach((l) => (l.keyIds = l.keyIds.filter((k) => k !== id)));
          if (S.sel && S.sel.id === id) S.sel = null;
        }
        function deleteLock(id) {
          S.doc.locks = S.doc.locks.filter((l) => l.id !== id);
          S.doc.doors.forEach((d) => {
            if (d.lockId === id) { d.lockId = null; if (d.kind === "locked") d.kind = "door"; }
          });
          if (S.sel && S.sel.id === id) S.sel = null;
        }
        function createLock() {
          const l = {
            id: uid("lock"),
            name: "Lock " + (S.doc.locks.length + 1),
            color: LOCK_COLORS[S.doc.locks.length % LOCK_COLORS.length],
            keyIds: [],
          };
          S.doc.locks.push(l);
          return l;
        }
        function createKeyAt(x, y) {
          const k = {
            id: uid("key"),
            name: "Key " + (S.doc.keys.length + 1),
            color: LOCK_COLORS[S.doc.keys.length % LOCK_COLORS.length],
            x, y,
          };
          S.doc.keys.push(k);
          return k;
        }
        /* ── Structures (cell layer over rooms) ───────────────────── */
        function createStruct() {
          const n = S.doc.structures.length;
          const s = { id: uid("struct"), name: "Structure " + (n + 1), color: STRUCT_COLORS[n % STRUCT_COLORS.length], notes: "", cells: [] };
          S.doc.structures.push(s);
          S.activeStructId = s.id;
          return s;
        }
        /** Put cell `k` into structure `st`, taking it from whichever structure held it. */
        function setStructCell(k, st) {
          const ownerId = structIndex.get(k);
          if (ownerId === st.id) return false;
          if (ownerId) {
            const owner = structById(ownerId);
            owner.cells = owner.cells.filter((c) => c !== k);
          }
          st.cells.push(k);
          structIndex.set(k, st.id);
          return true;
        }
        function eraseStructCell(k) {
          const ownerId = structIndex.get(k);
          if (!ownerId) return false;
          const owner = structById(ownerId);
          owner.cells = owner.cells.filter((c) => c !== k);
          structIndex.delete(k);
          return true;
        }
        function dropEmptyStructs() {
          const gone = new Set(S.doc.structures.filter((s) => !s.cells.length).map((s) => s.id));
          if (!gone.size) return;
          S.doc.structures = S.doc.structures.filter((s) => !gone.has(s.id));
          if (gone.has(S.activeStructId)) S.activeStructId = null;
          if (S.sel && S.sel.type === "struct" && gone.has(S.sel.id)) S.sel = null;
        }
        function deleteStruct(id) {
          S.doc.structures = S.doc.structures.filter((s) => s.id !== id);
          if (S.activeStructId === id) S.activeStructId = null;
          if (S.sel && S.sel.id === id) S.sel = null;
        }

        /* ── Edge structures (thick grid edges, e.g. platforms) ────── */
        function createEdgeStruct() {
          const n = S.doc.edgeStructs.length;
          const s = { id: uid("edge"), name: "Platform " + (n + 1), color: STRUCT_COLORS[(n + 4) % STRUCT_COLORS.length], notes: "", edges: [] };
          S.doc.edgeStructs.push(s);
          S.activeEdgeId = s.id;
          return s;
        }
        function setEdge(k, es) {
          const ownerId = edgeIndex.get(k);

        /* ── Stamps (one emoji per cell, top layer) ─────────────────── */

        }
        /* ── Notes (standalone single-cell annotations) ────────────── */
        function createNoteAt(x, y) {
          const n = {
            id: uid("note"),
            name: "Note " + (S.doc.notes.length + 1),
            text: "",
            color: NOTE_COLORS[0],
            x, y,
            expanded: false,
          };
          S.doc.notes.push(n);
          return n;
        }
        function deleteNote(id) {

          if (S.sel && S.sel.id === id) S.sel = null;
        }

        function shiftStampCells(pairs, dx, dy) {
          if (!pairs.length) return;

          for (const [st, c] of pairs) {

            bySt.get(st).add(c);
          }
          for (const [st, set] of bySt) st.cells = st.cells.filter((c) => !set.has(c));

        /* ── Ordering ───────────────────────────────────────────────── */
        // List order is array order, which is also draw order: later entries paint over earlier ones.
        /** The array a selection lives in, plus a peer test (rooms only reorder within their area). */
        function orderScope(sel) {
          if (!sel) return null;
          const t = sel.type;
          const arr =
            t === "room" ? S.doc.rooms : t === "struct" ? S.doc.structures : t === "edge" ? S.doc.edgeStructs :
            t === "stamp" ? S.doc.stamps : t === "lock" ? S.doc.locks : t === "key" ? S.doc.keys : null;
          if (!arr) return null;
          const item = arr.find((x) => x.id === sel.id);

          const { arr, item, peers, pos } = sc;
          let to = how === "top" ? 0 : how === "bottom" ? peers.length - 1 : pos + (how === "up" ? -1 : 1);
          to = clamp(to, 0, peers.length - 1);
          if (to === pos) return false;
          pushUndo();
          const target = peers[to];
          arr.splice(arr.indexOf(item), 1);
          const ti = arr.indexOf(target);
          arr.splice(to > pos ? ti + 1 : ti, 0, item);
          commit();
          return true;
        }

        /** Shift the given [structure, cellKey] pairs by (dx,dy), displacing whatever sits at the destination. */
        function shiftStructCells(pairs, dx, dy) {

          for (const [st, c] of pairs) {
            if (!bySt.has(st)) bySt.set(st, new Set());

          for (const [es, set] of bySt) es.edges = es.edges.filter((k) => !set.has(k));

          for (const [es, k] of pairs) {

          }
        }
        function translateStruct(st, dx, dy) {
          if (!dx && !dy) return;
          shiftStructCells(st.cells.map((c) => [st, c]), dx, dy);
        }
        function translateEdgeStruct(es, dx, dy) {
          if (!dx && !dy) return;
          shiftEdges(es.edges.map((k) => [es, k]), dx, dy);
        }

        /** Move a room's cells, its keys, the doors it solely owns, and the structures sitting on it. */
        function translateRoom(room, dx, dy) {
          if (!dx && !dy) return;
          const owned = new Set(room.cells);
          // an edge rides along when it touches the room and isn't shared with a *different* room
          const ownsEdge = (d) => {
            const cs = edgeCells(d);
            const inRoom = cs.filter(([x, y]) => owned.has(ck(x, y)));
            if (!inRoom.length) return false;
            return cs.every(([x, y]) => {
              const o = cellIndex.get(ck(x, y));
              return !o || o === room.id;
            });
          };
          const movingDoors = S.doc.doors.filter(ownsEdge);
          const movingKeys = S.doc.keys.filter((k) => owned.has(ck(k.x, k.y)));
          const movingSCells = [];
          for (const st of S.doc.structures) for (const c of st.cells) if (owned.has(c)) movingSCells.push([st, c]);
          const movingEdges = [];
          for (const es of S.doc.edgeStructs) for (const k of es.edges) if (ownsEdge(unek(k))) movingEdges.push([es, k]);
          const movingNotes = S.doc.notes.filter((n) => owned.has(ck(n.x, n.y)));
          const movingStamps = [];
          for (const st of S.doc.stamps) for (const c of st.cells) if (owned.has(c)) movingStamps.push([st, c]);

          room.cells.forEach((c) => cellIndex.delete(c));
          room.cells = room.cells.map((c) => {
            const [x, y] = unck(c);
            return ck(x + dx, y + dy);
          });
          // displace anything already sitting in the destination
          for (const c of room.cells) {
            const ownerId = cellIndex.get(c);
            if (ownerId && ownerId !== room.id) {
              const o = roomById(ownerId);
              o.cells = o.cells.filter((z) => z !== c);
            }
          }
          movingDoors.forEach((d) => { d.x += dx; d.y += dy; });
          movingKeys.forEach((k) => { k.x += dx; k.y += dy; });
          reindex();
          shiftStructCells(movingSCells, dx, dy);
          shiftEdges(movingEdges, dx, dy);
          shiftStampCells(movingStamps, dx, dy);
          // notes ride along; one already sitting at the destination gives way
          const landing = new Set(movingNotes.map((n) => ck(n.x + dx, n.y + dy)));
          const moving = new Set(movingNotes);
          S.doc.notes = S.doc.notes.filter((n) => moving.has(n) || !landing.has(ck(n.x, n.y)));
          movingNotes.forEach((n) => { n.x += dx; n.y += dy; });
          // shift greybox geometry with the room
          const det = S.doc.detail[room.id];
          if (det) det.boxes.forEach((b) => { b.x += dx * det.sub; b.y += dy * det.sub; });
          dropEmptyRooms();
        }

        /* ══════════════════════════════════════════════════════════════
           8 · Camera / view
           ══════════════════════════════════════════════════════════════ */
        const worldCanvas = $("#world");
        const wctx = worldCanvas.getContext("2d");
        let VW = 0, VH = 0;

        function makeView(cam, w, h) {
          return {
            cam, w, h,
            sx: (wx) => (wx - cam.x) * cam.zoom + w / 2,
            sy: (wy) => (wy - cam.y) * cam.zoom + h / 2,
            wx: (sx) => (sx - w / 2) / cam.zoom + cam.x,
            wy: (sy) => (sy - h / 2) / cam.zoom + cam.y,
          };
        }
        function resizeCanvas(canvas, ctx) {
          const dpr = window.devicePixelRatio || 1;
          const r = canvas.getBoundingClientRect();
          const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          return [w, h];
        }
        function zoomAt(cam, sxPt, syPt, factor, view) {
          const bx = view.wx(sxPt), by = view.wy(syPt);
          cam.zoom = clamp(cam.zoom * factor, 0.08, 8);
          const v2 = makeView(cam, view.w, view.h);
          cam.x += bx - v2.wx(sxPt);
          cam.y += by - v2.wy(syPt);
        }
        function fitWorld() {
          const b = docBBox();
          if (!b) {
            S.cam.x = 0; S.cam.y = 0; S.cam.zoom = 1;
          } else {
            const pw = (b.x1 - b.x0 + 1) * CELL, ph = (b.y1 - b.y0 + 1) * CELL;
            S.cam.x = (b.x0 * CELL + pw / 2);
            S.cam.y = (b.y0 * CELL + ph / 2);
            S.cam.zoom = clamp(Math.min((VW - 80) / pw, (VH - 80) / ph), 0.08, 3);
          }
          needsDraw = true;
        }

        /* ══════════════════════════════════════════════════════════════
           9 · World rendering
           ══════════════════════════════════════════════════════════════ */
        function drawGrid(ctx, V, cellPx) {
          const z = V.cam.zoom, step = cellPx * z;
          const left = V.wx(0), top = V.wy(0), right = V.wx(V.w), bottom = V.wy(V.h);
          const x0 = Math.floor(left / cellPx), x1 = Math.ceil(right / cellPx);
          const y0 = Math.floor(top / cellPx), y1 = Math.ceil(bottom / cellPx);

          if (step >= 5) {
            ctx.lineWidth = 1;
            ctx.strokeStyle = "#1e2430";
            ctx.beginPath();
            for (let x = x0; x <= x1; x++) {
              if (x % MAJOR === 0) continue;
              const px = Math.round(V.sx(x * cellPx)) + 0.5;
              ctx.moveTo(px, 0); ctx.lineTo(px, V.h);
            }
            for (let y = y0; y <= y1; y++) {
              if (y % MAJOR === 0) continue;
              const py = Math.round(V.sy(y * cellPx)) + 0.5;
              ctx.moveTo(0, py); ctx.lineTo(V.w, py);
            }
            ctx.stroke();
          }
          ctx.lineWidth = 1;
          ctx.strokeStyle = "#2b3444";
          ctx.beginPath();
          for (let x = Math.ceil(x0 / MAJOR) * MAJOR; x <= x1; x += MAJOR) {
            const px = Math.round(V.sx(x * cellPx)) + 0.5;
            ctx.moveTo(px, 0); ctx.lineTo(px, V.h);
          }
          for (let y = Math.ceil(y0 / MAJOR) * MAJOR; y <= y1; y += MAJOR) {
            const py = Math.round(V.sy(y * cellPx)) + 0.5;
            ctx.moveTo(0, py); ctx.lineTo(V.w, py);
          }
          ctx.stroke();

          // origin cross
          ctx.strokeStyle = "#3a4658";
          ctx.beginPath();
          const ox = Math.round(V.sx(0)) + 0.5, oy = Math.round(V.sy(0)) + 0.5;
          ctx.moveTo(ox, 0); ctx.lineTo(ox, V.h);
          ctx.moveTo(0, oy); ctx.lineTo(V.w, oy);
          ctx.stroke();
        }

        function drawRooms(ctx, V) {
          const z = V.cam.zoom;
          const selRoomId = S.sel && S.sel.type === "room" ? S.sel.id : null;

          for (const room of S.doc.rooms) {
            const col = roomColor(room);
            const cells = room.cells;
            if (!cells.length) continue;
            const set = new Set(cells);
            const isSel = room.id === selRoomId;
            const isActive = room.id === S.activeRoomId;

            ctx.fillStyle = hexA(col, isSel ? 0.4 : 0.26);
            for (const c of cells) {
              const [x, y] = unck(c);
              const px = V.sx(x * CELL), py = V.sy(y * CELL);
              const s = CELL * z;
              if (px > V.w || py > V.h || px + s < 0 || py + s < 0) continue;
              ctx.fillRect(px, py, s + 0.5, s + 0.5);
            }

            // outline only the silhouette edges
            ctx.strokeStyle = isSel ? shade(col, 0.3) : col;
            ctx.lineWidth = isSel ? 2.5 : isActive ? 2 : 1.6;
            ctx.lineCap = "square";
            ctx.beginPath();
            for (const c of cells) {
              const [x, y] = unck(c);
              const L = V.sx(x * CELL), T = V.sy(y * CELL);
              const R = V.sx((x + 1) * CELL), B = V.sy((y + 1) * CELL);
              if (R < 0 || B < 0 || L > V.w || T > V.h) continue;
              if (!set.has(ck(x, y - 1))) { ctx.moveTo(L, T); ctx.lineTo(R, T); }
              if (!set.has(ck(x, y + 1))) { ctx.moveTo(L, B); ctx.lineTo(R, B); }
              if (!set.has(ck(x - 1, y))) { ctx.moveTo(L, T); ctx.lineTo(L, B); }
              if (!set.has(ck(x + 1, y))) { ctx.moveTo(R, T); ctx.lineTo(R, B); }
            }
            ctx.stroke();
          }
        }

        function drawRoomLabels(ctx, V) {
          const z = V.cam.zoom;
          if (z * CELL > 16) {
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (const room of S.doc.rooms) {
              if (room.hideName) continue;
              const b = roomBBox(room);
              if (!b) continue;
              const cx = V.sx((b.x0 + b.w / 2) * CELL), cy = V.sy((b.y0 + b.h / 2) * CELL);
              if (cx < -80 || cy < -20 || cx > V.w + 80 || cy > V.h + 20) continue;
              const fs = clamp(Math.round(11 * Math.min(1.4, z)), 9, 15);
              ctx.font = `600 ${fs}px ${FONTF}`;
              const tw = ctx.measureText(room.name).width;
              ctx.fillStyle = "rgba(10,12,16,0.62)";
              ctx.fillRect(cx - tw / 2 - 4, cy - fs / 2 - 2, tw + 8, fs + 4);
              ctx.fillStyle = "#e6ecf6";
              ctx.fillText(room.name, cx, cy + 0.5);
            }
          }
        }

        /** Diagonal hatch laid over structure fills so they read differently from rooms. */
        const hatchCache = new WeakMap();
        function hatchPattern(ctx) {
          if (hatchCache.has(ctx)) return hatchCache.get(ctx);
          const c = document.createElement("canvas");
          c.width = c.height = 8;
          const g = c.getContext("2d");
          g.strokeStyle = "rgba(8,10,14,0.38)";
          g.lineWidth = 1.6;
          g.beginPath();
          g.moveTo(-2, 10); g.lineTo(10, -2);
          g.moveTo(-2, 2); g.lineTo(2, -2);
          g.moveTo(6, 10); g.lineTo(10, 6);
          g.stroke();
          const p = ctx.createPattern(c, "repeat");
          hatchCache.set(ctx, p);
          return p;
        }

        function drawStructures(ctx, V) {
          const z = V.cam.zoom, s = CELL * z;
          const selId = S.sel && S.sel.type === "struct" ? S.sel.id : null;
          const hatch = hatchPattern(ctx);
          if (hatch && hatch.setTransform && typeof DOMMatrix !== "undefined") {
            // anchor the hatch to the world so it doesn't swim while panning
            try { hatch.setTransform(new DOMMatrix().translate(V.sx(0), V.sy(0))); } catch (e) {}
          }
          for (const st of S.doc.structures) {
            if (!st.cells.length) continue;
            const col = structColor(st);
            const set = new Set(st.cells);
            const isSel = st.id === selId;
            const isActive = st.id === S.activeStructId;

            ctx.beginPath();
            for (const c of st.cells) {
              const [x, y] = unck(c);
              const px = V.sx(x * CELL), py = V.sy(y * CELL);
              if (px > V.w || py > V.h || px + s < 0 || py + s < 0) continue;
              ctx.rect(px, py, s + 0.5, s + 0.5);
            }
            ctx.fillStyle = hexA(col, isSel ? 0.78 : 0.6);
            ctx.fill();
            if (hatch && s >= 6) {
              ctx.fillStyle = hatch;
              ctx.fill();
            }

            ctx.strokeStyle = isSel ? "#ffffff" : shade(col, 0.22);
            ctx.lineWidth = isSel ? 2.2 : isActive ? 1.8 : 1.2;
            ctx.lineCap = "square";
            ctx.beginPath();
            for (const c of st.cells) {
              const [x, y] = unck(c);
              const L = V.sx(x * CELL), T = V.sy(y * CELL);
              const R = V.sx((x + 1) * CELL), B = V.sy((y + 1) * CELL);
              if (R < 0 || B < 0 || L > V.w || T > V.h) continue;
              if (!set.has(ck(x, y - 1))) { ctx.moveTo(L, T); ctx.lineTo(R, T); }
              if (!set.has(ck(x, y + 1))) { ctx.moveTo(L, B); ctx.lineTo(R, B); }
              if (!set.has(ck(x - 1, y))) { ctx.moveTo(L, T); ctx.lineTo(L, B); }
              if (!set.has(ck(x + 1, y))) { ctx.moveTo(R, T); ctx.lineTo(R, B); }
            }
            ctx.stroke();
          }
        }

        const edgeThickness = (z) => clamp(CELL * z * 0.16, 2.5, 9);

        function strokeEdgeKeys(ctx, V, keys) {
          ctx.beginPath();
          for (const k of keys) {
            const [x0, y0, x1, y1] = edgeEnds(unek(k));
            const ax = V.sx(x0), ay = V.sy(y0), bx = V.sx(x1), by = V.sy(y1);
            if (Math.max(ax, bx) < -20 || Math.max(ay, by) < -20 || Math.min(ax, bx) > V.w + 20 || Math.min(ay, by) > V.h + 20) continue;
            ctx.moveTo(ax, ay);
            ctx.lineTo(bx, by);
          }
          ctx.stroke();
        }

        function drawEdgeStructs(ctx, V) {
          const z = V.cam.zoom;
          const selId = S.sel && S.sel.type === "edge" ? S.sel.id : null;
          const t = edgeThickness(z);
          ctx.save();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          for (const es of S.doc.edgeStructs) {
            if (!es.edges.length) continue;
            const col = structColor(es);
            const isSel = es.id === selId;
            if (isSel) {
              ctx.strokeStyle = hexA(col, 0.35);
              ctx.lineWidth = t * 2.6;
              strokeEdgeKeys(ctx, V, es.edges);
            }
            ctx.strokeStyle = "rgba(8,10,14,0.85)";
            ctx.lineWidth = t + 2;
            strokeEdgeKeys(ctx, V, es.edges);
            ctx.strokeStyle = isSel ? shade(col, 0.18) : col;
            ctx.lineWidth = t;
            strokeEdgeKeys(ctx, V, es.edges);
          }
          ctx.restore();
        }

        function drawStructLabels(ctx, V) {
          const z = V.cam.zoom;
          if (z * CELL <= 16) return;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const fs = clamp(Math.round(10 * Math.min(1.3, z)), 9, 13);
          ctx.font = `italic 600 ${fs}px ${FONTF}`;
          const label = (text, col, cx, cy) => {
            if (!text || cx < -80 || cy < -20 || cx > V.w + 80 || cy > V.h + 20) return;
            const tw = ctx.measureText(text).width;
            ctx.fillStyle = "rgba(10,12,16,0.72)";
            ctx.fillRect(cx - tw / 2 - 3, cy - fs / 2 - 2, tw + 6, fs + 4);
            ctx.fillStyle = shade(col, 0.3);
            ctx.fillText(text, cx, cy + 0.5);
          };
          for (const st of S.doc.structures) {
            if (st.hideName) continue;
            const b = cellsBBox(st.cells);
            if (!b) continue;
            label(st.name, structColor(st), V.sx((b.x0 + b.w / 2) * CELL), V.sy((b.y0 + b.h / 2) * CELL));
          }
          for (const es of S.doc.edgeStructs) {
            if (!es.edges.length || es.hideName) continue;
            // anchor on the edge nearest the middle of the set, just off the line
            let sx = 0, sy = 0;
            const mids = es.edges.map((k) => edgeMid(unek(k)));
            mids.forEach((m) => { sx += m.x; sy += m.y; });
            sx /= mids.length; sy /= mids.length;
            let best = 0, bd = Infinity;
            mids.forEach((m, i) => { const d = Math.hypot(m.x - sx, m.y - sy); if (d < bd) { bd = d; best = i; } });
            const e = unek(es.edges[best]), m = mids[best];
            const off = edgeThickness(z) / 2 + fs / 2 + 4;
            const cx = V.sx(m.x) + (e.o === "v" ? off + ctx.measureText(es.name).width / 2 : 0);
            const cy = V.sy(m.y) - (e.o === "h" ? off : 0);
            label(es.name, structColor(es), cx, cy);
          }
        }

        function drawDoors(ctx, V) {
          const z = V.cam.zoom;
          const selId = S.sel && S.sel.type === "door" ? S.sel.id : null;
          const selLock = S.sel && S.sel.type === "lock" ? S.sel.id : null;

          for (const d of S.doc.doors) {
            const m = edgeMid(d);
            const cx = V.sx(m.x), cy = V.sy(m.y);
            if (cx < -30 || cy < -30 || cx > V.w + 30 || cy > V.h + 30) continue;
            const lock = d.lockId ? lockById(d.lockId) : null;
            const along = CELL * z * 0.52; // length along the wall
            const thick = clamp(CELL * z * 0.2, 3, 12); // thickness across the wall

            let fill = "#93a0b4", stroke = "#0e1116";
            if (d.kind === "passage") fill = "#5b6779";
            if (lock) fill = lock.color;
            if (d.kind === "oneway") fill = lock ? lock.color : "#f0a13a";

            const w = d.o === "v" ? thick : along;
            const h = d.o === "v" ? along : thick;
            const highlight = d.id === selId || (selLock && d.lockId === selLock);

            if (highlight) {
              ctx.fillStyle = hexA(lock ? lock.color : "#5aa9f0", 0.3);
              ctx.beginPath();
              ctx.arc(cx, cy, Math.max(w, h) * 0.95, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.fillStyle = fill;
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 1;
            roundRect(ctx, cx - w / 2, cy - h / 2, w, h, Math.min(3, thick / 2));
            ctx.fill();
            if (z > 0.4) ctx.stroke();

            if (d.kind === "oneway" && z > 0.35) {
              // arrow pointing in the traversable direction
              ctx.fillStyle = "#15181f";
              const s = Math.max(2.5, thick * 0.42);
              ctx.beginPath();
              if (d.o === "v") {
                const dx = d.dir * s;
                ctx.moveTo(cx + dx, cy);
                ctx.lineTo(cx - dx * 0.5, cy - s);
                ctx.lineTo(cx - dx * 0.5, cy + s);
              } else {
                const dy = d.dir * s;
                ctx.moveTo(cx, cy + dy);
                ctx.lineTo(cx - s, cy - dy * 0.5);
                ctx.lineTo(cx + s, cy - dy * 0.5);
              }
              ctx.closePath();
              ctx.fill();
            } else if (lock && z > 0.5) {
              ctx.fillStyle = "rgba(12,14,19,0.85)";
              ctx.beginPath();
              ctx.arc(cx, cy, Math.max(1.5, thick * 0.22), 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        function drawKeys(ctx, V) {
          const z = V.cam.zoom;
          const selId = S.sel && S.sel.type === "key" ? S.sel.id : null;
          const selLock = S.sel && S.sel.type === "lock" ? lockById(S.sel.id) : null;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          for (const k of S.doc.keys) {
            const cx = V.sx(k.x * CELL + CELL / 2), cy = V.sy(k.y * CELL + CELL / 2);
            if (cx < -40 || cy < -40 || cx > V.w + 40 || cy > V.h + 40) continue;
            const r = clamp(CELL * z * 0.26, 3, 22);
            const on = k.id === selId || (selLock && selLock.keyIds.includes(k.id));

            if (on) {
              ctx.fillStyle = hexA(k.color, 0.28);
              ctx.beginPath();
              ctx.arc(cx, cy, r * 2, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = k.color;
            ctx.fill();
            ctx.lineWidth = on ? 2 : 1.2;
            ctx.strokeStyle = on ? "#ffffff" : "rgba(10,12,16,0.8)";
            ctx.stroke();

            if (z > 0.55) {
              ctx.fillStyle = "rgba(10,12,16,0.85)";
              ctx.font = `${Math.round(r * 1.25)}px ${FONTF}`;
              ctx.fillText("✦", cx, cy + r * 0.06);
            }
            if (z > 0.75 && !k.hideName) {
              const fs = clamp(Math.round(10 * Math.min(1.3, z)), 9, 13);
              ctx.font = `500 ${fs}px ${FONTF}`;
              const tw = ctx.measureText(k.name).width;
              ctx.fillStyle = "rgba(10,12,16,0.66)";
              ctx.fillRect(cx - tw / 2 - 3, cy + r + 2, tw + 6, fs + 3);
              ctx.fillStyle = shade(k.color, 0.25);
              ctx.fillText(k.name, cx, cy + r + 2 + fs / 2 + 2);
            }
          }
        }

        /** Curved dashed links from every key to the doors its lock guards. */
        function drawFlow(ctx, V) {
          const showAll = S.showFlow;
          let locks = S.doc.locks;
          if (!showAll) {
            if (!S.sel) return;
            if (S.sel.type === "lock") locks = [lockById(S.sel.id)].filter(Boolean);
            else if (S.sel.type === "key") locks = S.doc.locks.filter((l) => l.keyIds.includes(S.sel.id));
            else if (S.sel.type === "door") {
              const d = S.doc.doors.find((x) => x.id === S.sel.id);
              locks = d && d.lockId ? [lockById(d.lockId)].filter(Boolean) : [];
            } else return;
          }
          if (!locks.length) return;

          ctx.save();
          ctx.lineWidth = clamp(1.6 * V.cam.zoom, 1.1, 3);
          ctx.setLineDash([7, 5]);
          for (const lock of locks) {
            const doors = S.doc.doors.filter((d) => d.lockId === lock.id);
            if (!doors.length) continue;
            ctx.strokeStyle = hexA(lock.color, showAll ? 0.42 : 0.8);
            ctx.fillStyle = hexA(lock.color, showAll ? 0.5 : 0.9);
            for (const kid of lock.keyIds) {
              const k = keyById(kid);
              if (!k) continue;
              const ax = V.sx(k.x * CELL + CELL / 2), ay = V.sy(k.y * CELL + CELL / 2);
              for (const d of doors) {
                const m = edgeMid(d);
                const bx = V.sx(m.x), by = V.sy(m.y);
                const mx = (ax + bx) / 2, my = (ay + by) / 2;
                const nx = -(by - ay), ny = bx - ax;
                const len = Math.hypot(nx, ny) || 1;
                const bow = clamp(len * 0.14, 8, 70);
                const qx = mx + (nx / len) * bow, qy = my + (ny / len) * bow;
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.quadraticCurveTo(qx, qy, bx, by);
                ctx.stroke();
                // arrowhead at the door end
                const tx = bx - qx, ty = by - qy;
                const a = Math.atan2(ty, tx);
                const s = 6;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(bx - s * Math.cos(a - 0.42), by - s * Math.sin(a - 0.42));
                ctx.lineTo(bx - s * Math.cos(a + 0.42), by - s * Math.sin(a + 0.42));
                ctx.closePath();
                ctx.fill();
                ctx.setLineDash([7, 5]);
              }
            }
          }
          ctx.restore();
        }

        function drawCursor(ctx, V) {
          const z = V.cam.zoom, s = CELL * z;
          // rectangle drag preview
          if (S.drag && S.drag.type === "edgeline") {
            const d = S.drag;
            let keys = edgeLine(d.a, d.b);
            if (!keys.length) {
              const e = nearestEdge(d.cur.x, d.cur.y, 0.5);
              keys = e ? [ek(e.o, e.x, e.y)] : [];
            }
            const es = d.fresh ? null : activeEdgeStruct();
            ctx.save();
            ctx.lineCap = "round";
            ctx.strokeStyle = d.erase ? "rgba(224,85,95,0.85)" : hexA(es ? structColor(es) : "#5aa9f0", 0.7);
            ctx.lineWidth = edgeThickness(z) + 2;
            strokeEdgeKeys(ctx, V, keys);
            ctx.fillStyle = "#ffffff";
            for (const p of [d.a, d.b]) {
              ctx.beginPath();
              ctx.arc(V.sx(p.x * CELL), V.sy(p.y * CELL), 3, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
            return;
          }
          if (S.tool === "edge" && S.hoverEdge && !S.drag) {
            const e = S.hoverEdge;
            const es = activeEdgeStruct();
            ctx.save();
            ctx.lineCap = "round";
            ctx.strokeStyle = hexA(es ? structColor(es) : "#5aa9f0", 0.5);
            ctx.lineWidth = edgeThickness(z) + 2;
            strokeEdgeKeys(ctx, V, [ek(e.o, e.x, e.y)]);
            ctx.restore();
            return;
          }
          if (S.drag && S.drag.type === "rect") {
            const a = S.drag.a, b = S.drag.b;
            const x0 = Math.min(a.x, b.x), y0 = Math.min(a.y, b.y);
            const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
            const px = V.sx(x0 * CELL), py = V.sy(y0 * CELL);
            const room = activeRoom();
            let col = S.drag.erase ? "#e0555f" : room ? roomColor(room) : activeArea().color;
            if (S.drag.layer === "struct" && !S.drag.erase) col = structColor(S.drag.st);
            ctx.fillStyle = hexA(col, 0.22);
            ctx.strokeStyle = col;
            ctx.lineWidth = 1.5;
            ctx.fillRect(px, py, (x1 - x0 + 1) * s, (y1 - y0 + 1) * s);
