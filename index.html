            ctx.strokeRect(px + 0.5, py + 0.5, (x1 - x0 + 1) * s - 1, (y1 - y0 + 1) * s - 1);
            return;
          }
          if (S.tool === "door" && S.hoverEdge) {
            const e = S.hoverEdge;
            const m = edgeMid({ o: e.o, x: e.x, y: e.y });
            const cx = V.sx(m.x), cy = V.sy(m.y);
            const along = s * 0.52, thick = clamp(s * 0.2, 3, 12);
            ctx.fillStyle = "rgba(90,169,240,0.55)";
            const w = e.o === "v" ? thick : along, h = e.o === "v" ? along : thick;
            roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 2);
            ctx.fill();
            return;
          }
          if (!S.hoverCell) return;
          if (S.tool === "pan" || S.tool === "select") return;
          const px = V.sx(S.hoverCell.x * CELL), py = V.sy(S.hoverCell.y * CELL);
          const room = activeRoom();
          let col = S.tool === "erase" || S.tool === "serase" ? "#e0555f" : S.tool === "key" ? "#f0dc3a" : room ? roomColor(room) : activeArea().color;
          if (S.tool === "spaint" || S.tool === "srect") {
            const st = activeStruct();
            col = st ? structColor(st) : STRUCT_COLORS[S.doc.structures.length % STRUCT_COLORS.length];
          }
          if (S.tool === "stamp") {
            const st = activeStamp();
            col = st ? structColor(st) : "#f0dc3a";
            if (st && s >= 5) {
              ctx.save();
              ctx.globalAlpha = 0.45;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.font = `${Math.max(6, Math.round(s * 0.62))}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", ${FONTF}`;
              ctx.fillStyle = "#ffffff";
              ctx.fillText(st.emoji, px + s / 2, py + s / 2 + s * 0.04);
              ctx.restore();
            }
          }
          ctx.strokeStyle = col;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 3]);
          ctx.strokeRect(px + 1, py + 1, s - 2, s - 2);
          ctx.setLineDash([]);
        }

        function roundRect(ctx, x, y, w, h, r) {
          r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        function drawStamps(ctx, V) {
          const z = V.cam.zoom, s = CELL * z;
          const selId = S.sel && S.sel.type === "stamp" ? S.sel.id : null;
          const selCell = selId ? S.sel.cell : null;
          const showNames = S.showStructLabels && z > 0.9;
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const fs = clamp(Math.round(9.5 * Math.min(1.3, z)), 8, 12);
          const placed = [];
          for (const st of S.doc.stamps) {
            const col = structColor(st);
            const isSel = st.id === selId;
            for (const c of st.cells) {
              const [x, y] = unck(c);
              const px = V.sx(x * CELL), py = V.sy(y * CELL);
              if (px > V.w || py > V.h || px + s < 0 || py + s < 0) continue;
              const cx = px + s / 2, cy = py + s / 2;
              const pad = Math.max(1, s * 0.08);
              ctx.fillStyle = hexA(col, isSel ? 0.5 : 0.32);
              roundRect(ctx, px + pad, py + pad, s - pad * 2, s - pad * 2, Math.min(6, s * 0.18));
              ctx.fill();
              if (isSel) {
                ctx.lineWidth = c === selCell ? 2.2 : 1.4;
                ctx.strokeStyle = c === selCell ? "#ffffff" : shade(col, 0.3);
                ctx.stroke();
              }
              if (s >= 5) {
                ctx.font = `${Math.max(6, Math.round(s * 0.62))}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", ${FONTF}`;
                ctx.fillStyle = "#ffffff";
                ctx.fillText(st.emoji, cx, cy + s * 0.04);
              }
              if (showNames && !st.hideName && st.name) {
                ctx.font = `500 ${fs}px ${FONTF}`;
                const tw = ctx.measureText(st.name).width;
                const box = { x: cx - tw / 2 - 3, y: py + s + 1, w: tw + 6, h: fs + 3 };
                // neighbouring stamps would stack their labels on top of each other — first one wins
                if (!placed.some((b) => box.x < b.x + b.w && b.x < box.x + box.w && box.y < b.y + b.h && b.y < box.y + box.h)) {
                  placed.push(box);
                  ctx.fillStyle = "rgba(10,12,16,0.72)";
                  ctx.fillRect(box.x, box.y, box.w, box.h);
                  ctx.fillStyle = shade(col, 0.3);
                  ctx.fillText(st.name, cx, py + s + 1 + fs / 2 + 1.5);
                }
              }
            }
          }
          ctx.restore();
        }

        /** Break `text` into lines no wider than `maxW` (ctx.font must be set); handles CJK and long words. */
        function wrapLines(ctx, text, maxW, maxLines) {
          const out = [];
          for (const para of String(text).split("\n")) {
            let line = "", lastSpace = -1;
            for (const ch of Array.from(para)) {
              const next = line + ch;
              if (ctx.measureText(next).width <= maxW || !line) {
                line = next;
                if (/\s/.test(ch)) lastSpace = line.length;
                continue;
              }
              if (lastSpace > 0 && !/\s/.test(ch)) {
                out.push(line.slice(0, lastSpace).trimEnd());
                line = line.slice(lastSpace) + ch;
              } else {
                out.push(line.trimEnd());
                line = /\s/.test(ch) ? "" : ch;
              }
              lastSpace = -1;
              if (out.length >= maxLines) break;
            }
            if (out.length >= maxLines) break;
            out.push(line);
          }
          if (out.length > maxLines) out.length = maxLines;
          return out;
        }

        /** Screen-space layout of a note: its marker, the expand button, and (when open) the text box. */
        function noteGeom(ctx, V, n) {
          const s = CELL * V.cam.zoom;
          const px = V.sx(n.x * CELL), py = V.sy(n.y * CELL);
          const pad = Math.max(1, s * 0.14);
          const g = { s, px, py, marker: { x: px + pad, y: py + pad, w: s - pad * 2, h: s - pad * 2 } };
          if (s >= 12) {
            const r = clamp(s * 0.16, 5.5, 9);
            g.btn = { cx: px + s - r * 0.35, cy: py + r * 0.35, r };
          }
          if (n.expanded) {
            const W = NOTE_BOX_W, padX = 10, headH = 24, lh = 16;
            ctx.font = `12px ${FONTF}`;
            const body = n.text.trim() ? wrapLines(ctx, n.text, W - padX * 2, 40) : null;
            const h = headH + (body ? body.length * lh : lh) + 10;
            const box = { x: px + s + 8, y: py, w: W, h, headH, lh, padX, body };
            box.btn = { cx: box.x + W - 13, cy: box.y + headH / 2, r: 8 };
            g.box = box;
          }
          return g;
        }
        const inCircle = (c, x, y) => c && Math.hypot(x - c.cx, y - c.cy) <= c.r + 2;
        const inRect = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

        /** The note part under a screen point: expand/collapse button, open text box, or marker. */
        function noteHit(V, sx, sy) {
          if (!S.showNotes) return null;
          const notes = S.doc.notes;
          const geoms = notes.map((n) => noteGeom(wctx, V, n));
          // later notes are drawn on top, so test them first; open boxes sit above every marker
          for (let i = notes.length - 1; i >= 0; i--) {
            const b = geoms[i].box;
            if (!b) continue;
            if (inCircle(b.btn, sx, sy)) return { note: notes[i], part: "toggle" };
            if (inRect(b, sx, sy)) return { note: notes[i], part: "box" };
          }
          for (let i = notes.length - 1; i >= 0; i--) {
            if (inCircle(geoms[i].btn, sx, sy)) return { note: notes[i], part: "toggle" };
          }
          for (let i = notes.length - 1; i >= 0; i--) {
            const g = geoms[i];
            if (sx >= g.px && sx < g.px + g.s && sy >= g.py && sy < g.py + g.s) return { note: notes[i], part: "cell" };
          }
          return null;
        }

        function drawToggle(ctx, c, col, open) {
          ctx.beginPath();
          ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2);
          ctx.fillStyle = "#12151b";
          ctx.fill();
          ctx.lineWidth = 1.4;
          ctx.strokeStyle = col;
          ctx.stroke();
          const a = c.r * 0.5;
          ctx.beginPath();
          ctx.moveTo(c.cx - a, c.cy);
          ctx.lineTo(c.cx + a, c.cy);
          if (!open) { ctx.moveTo(c.cx, c.cy - a); ctx.lineTo(c.cx, c.cy + a); }
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = "#e6ecf6";
          ctx.stroke();
        }

        function drawNotes(ctx, V) {
          const selId = S.sel && S.sel.type === "note" ? S.sel.id : null;
          const geoms = S.doc.notes.map((n) => [n, noteGeom(ctx, V, n)]);
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          // markers and their labels
          for (const [n, g] of geoms) {
            const { s, px, py, marker: m } = g;
            if (px > V.w + 260 || py > V.h || px + s < 0 || py + s + 20 < 0) continue;
            const col = n.color || NOTE_COLORS[0];
            const fold = Math.min(m.w, m.h) * 0.3;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(m.x + m.w, m.y);
            ctx.lineTo(m.x + m.w, m.y + m.h - fold);
            ctx.lineTo(m.x + m.w - fold, m.y + m.h);
            ctx.lineTo(m.x, m.y + m.h);
            ctx.closePath();
            ctx.fillStyle = hexA(col, 0.92);
            ctx.fill();
            ctx.lineWidth = n.id === selId ? 2.2 : 1;
            ctx.strokeStyle = n.id === selId ? "#ffffff" : "rgba(10,12,16,0.75)";
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(m.x + m.w, m.y + m.h - fold);
            ctx.lineTo(m.x + m.w - fold, m.y + m.h - fold);
            ctx.lineTo(m.x + m.w - fold, m.y + m.h);
            ctx.closePath();
            ctx.fillStyle = shade(col, -0.22);
            ctx.fill();
            if (s >= 14) {
              ctx.strokeStyle = "rgba(10,12,16,0.55)";
              ctx.lineWidth = Math.max(1, s * 0.035);
              ctx.beginPath();
              for (let i = 1; i <= 3; i++) {
                const ly = m.y + (m.h * i) / 4.4;
                ctx.moveTo(m.x + m.w * 0.18, ly);
                ctx.lineTo(m.x + m.w * (i === 3 ? 0.5 : 0.82), ly);
              }
              ctx.stroke();
            }
            if (g.btn) drawToggle(ctx, g.btn, col, n.expanded);
            if (!n.hideName && n.name && s > 12) {
              const fs = clamp(Math.round(9.5 * Math.min(1.3, V.cam.zoom)), 8, 12);
              ctx.font = `600 ${fs}px ${FONTF}`;
              const tw = ctx.measureText(n.name).width;
              ctx.fillStyle = "rgba(10,12,16,0.75)";
              ctx.fillRect(px + s / 2 - tw / 2 - 3, py + s + 1, tw + 6, fs + 3);
              ctx.fillStyle = shade(col, 0.2);
              ctx.fillText(n.name, px + s / 2, py + s + 1 + fs / 2 + 1.5);
            }
          }
          // open text boxes above everything else
          ctx.textAlign = "left";
          for (const [n, g] of geoms) {
            const b = g.box;
            if (!b || b.x > V.w || b.y > V.h || b.x + b.w < 0 || b.y + b.h < 0) continue;
            const col = n.color || NOTE_COLORS[0];
            const isSel = n.id === selId;
            // tail from the marker to the box
            ctx.strokeStyle = hexA(col, 0.7);
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(g.px + g.s, g.py + Math.min(g.s, b.headH) / 2);
            ctx.lineTo(b.x, b.y + b.headH / 2);
            ctx.stroke();
            roundRect(ctx, b.x, b.y, b.w, b.h, 7);
            ctx.fillStyle = "rgba(16,19,25,0.8)";
            ctx.fill();
            ctx.lineWidth = isSel ? 2 : 1.2;
            ctx.strokeStyle = isSel ? "#ffffff" : hexA(col, 0.85);
            ctx.stroke();
            ctx.fillStyle = hexA(col, 0.9);
            ctx.fillRect(b.x + 1, b.y + 4, 3, b.headH - 8);
            ctx.font = `600 12.5px ${FONTF}`;
            ctx.fillStyle = shade(col, 0.25);
            let title = n.name || "Note";
            const maxT = b.w - b.padX * 2 - 22;
            while (title.length > 1 && ctx.measureText(title).width > maxT) title = title.slice(0, -2) + "…";
            ctx.fillText(title, b.x + b.padX, b.y + b.headH / 2 + 0.5);
            ctx.font = `12px ${FONTF}`;
            if (b.body) {
              ctx.fillStyle = "#dfe5ef";
              b.body.forEach((ln, i) => ctx.fillText(ln, b.x + b.padX, b.y + b.headH + b.lh * i + b.lh / 2));
            } else {
              ctx.font = `italic 12px ${FONTF}`;
              ctx.fillStyle = "#7d8798";
              ctx.fillText("No details yet — add them in the Inspector.", b.x + b.padX, b.y + b.headH + b.lh / 2);
            }
            drawToggle(ctx, b.btn, col, true);
          }
          ctx.restore();
        }

        function drawWorld(ctx, V, opts) {
          opts = opts || {};
          ctx.save();
          ctx.fillStyle = opts.bg || "#12151b";
          ctx.fillRect(0, 0, V.w, V.h);
          if (opts.grid !== false) drawGrid(ctx, V, CELL);
          drawRooms(ctx, V);
          if (S.showStructs) {
            drawStructures(ctx, V);
            drawEdgeStructs(ctx, V);
          }
          if (opts.labels !== undefined ? opts.labels : S.showLabels) drawRoomLabels(ctx, V);
          if (S.showStructs && S.showStructLabels) drawStructLabels(ctx, V);
          drawFlow(ctx, V);
          drawDoors(ctx, V);
          drawKeys(ctx, V);
          if (S.showStructs) drawStamps(ctx, V);
          if (S.showNotes) drawNotes(ctx, V);
          if (opts.cursor !== false) drawCursor(ctx, V);
          ctx.restore();
        }

        /* ══════════════════════════════════════════════════════════════
           10 · Render loop
           ══════════════════════════════════════════════════════════════ */
        function frame() {
          if (needsDraw) {
            needsDraw = false;
            if (!S.detailRoomId) {
              const [w, h] = resizeCanvas(worldCanvas, wctx);
              VW = w; VH = h;
              drawWorld(wctx, makeView(S.cam, w, h), {});
              $("#hud-zoom").textContent = Math.round(S.cam.zoom * 100) + "%";
            } else {
              drawDetail();
            }
          }
          requestAnimationFrame(frame);
        }

        /* ══════════════════════════════════════════════════════════════
           11 · World input
           ══════════════════════════════════════════════════════════════ */
        function evPos(e) {
          const r = worldCanvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
        function cellAtEvent(V, p) {
          return { x: Math.floor(V.wx(p.x) / CELL), y: Math.floor(V.wy(p.y) / CELL) };
        }
        function pickAt(V, p) {
          const wx = V.wx(p.x), wy = V.wy(p.y);
          const c = { x: Math.floor(wx / CELL), y: Math.floor(wy / CELL) };
          // notes are the top layer, then stamps, then keys
          const nh = noteHit(V, p.x, p.y);
          if (nh) return { type: "note", id: nh.note.id, part: nh.part };
          if (S.showStructs) {
            const sid = stampIndex.get(ck(c.x, c.y));
            if (sid) return { type: "stamp", id: sid, cell: ck(c.x, c.y) };
          }
          for (let i = S.doc.keys.length - 1; i >= 0; i--) {
            const k = S.doc.keys[i];
            const dx = wx - (k.x * CELL + CELL / 2), dy = wy - (k.y * CELL + CELL / 2);
            if (Math.hypot(dx, dy) <= CELL * 0.3) return { type: "key", id: k.id };
          }
          const e = nearestEdge(wx, wy, 0.2);
          if (e) {
            const d = doorAtEdge(e.o, e.x, e.y);
            if (d) return { type: "door", id: d.id };
          }
          if (S.showStructs) {
            const ee = nearestEdge(wx, wy, 0.16);
            const eid = ee && edgeIndex.get(ek(ee.o, ee.x, ee.y));
            if (eid) return { type: "edge", id: eid };
            const sid = structIndex.get(ck(c.x, c.y));
            if (sid) return { type: "struct", id: sid };
          }
          const r = roomAtCell(c.x, c.y);
          if (r) return { type: "room", id: r.id };
          return null;
        }

        worldCanvas.addEventListener("pointerdown", (e) => {
          const rmb = e.button === 2;
          if (e.button === 1 || S.spaceDown || S.tool === "pan" || (rmb && S.rclick === "pan")) {
            e.preventDefault();
            worldCanvas.setPointerCapture(e.pointerId);
            S.drag = { type: "pan", last: evPos(e) };
            return;
          }
          if (e.button > 2) return;
          worldCanvas.setPointerCapture(e.pointerId);
          const V = makeView(S.cam, VW, VH);
          const p = evPos(e);
          const c = cellAtEvent(V, p);
          // right-click in "remove" mode behaves like holding Alt with the current tool
          const alt = e.altKey || rmb;
          const shift = e.shiftKey && !rmb;

          // a note's expand/collapse button works as a button whatever tool is active
          if (!alt && S.showNotes) {
            const nh = noteHit(V, p.x, p.y);
            if (nh && nh.part === "toggle") {
              pushUndo();
              nh.note.expanded = !nh.note.expanded;
              S.sel = { type: "note", id: nh.note.id };
              commit();
              return;
            }
            if (nh && (S.tool === "note" || nh.part === "box")) {
              S.sel = { type: "note", id: nh.note.id };
              S.drag = { type: "movenote", note: nh.note, undone: false };
              commit(true);
              return;
            }
          }
          if (S.tool === "note") {
            if (alt) {
              const nh = noteHit(V, p.x, p.y);
              const victim = nh ? nh.note : noteAtCell(c.x, c.y);
              if (victim) { pushUndo(); deleteNote(victim.id); commit(); }
              return;
            }
            const there = noteAtCell(c.x, c.y);
            if (there) { S.sel = { type: "note", id: there.id }; commit(true); return; }
            pushUndo();
            const n = createNoteAt(c.x, c.y);
            S.sel = { type: "note", id: n.id };
            commit();
            // jump straight into writing it
            const fld = $("#i-ntext");
            if (fld) fld.focus();
            return;
          }

          if (rmb && S.tool === "select") {
            removeAt(V, p);
            return;
          }
          if (rmb && S.tool === "key") {
            const victim = S.doc.keys.filter((k) => k.x === c.x && k.y === c.y).pop();
            if (victim) { pushUndo(); deleteKey(victim.id); commit(); }
            return;
          }

          if (S.tool === "select") {
            const hit = pickAt(V, p);
            S.sel = hit;
            if (hit && hit.type === "room") {
              S.activeRoomId = hit.id;
              const room = roomById(hit.id);
              S.activeAreaId = room.areaId;
              S.drag = { type: "move", room, startCell: c, moved: false, dx: 0, dy: 0, undone: false };
            } else if (hit && hit.type === "key") {
              S.drag = { type: "movekey", key: keyById(hit.id), startCell: c, moved: false, undone: false };
            } else if (hit && hit.type === "note") {
              S.sel = { type: "note", id: hit.id };
              S.drag = { type: "movenote", note: noteById(hit.id), undone: false };
            } else if (hit && hit.type === "stamp") {
              S.activeStampId = hit.id;
              S.drag = { type: "movestamp", st: stampById(hit.id), cell: hit.cell, undone: false };
            } else if (hit && hit.type === "struct") {
              S.activeStructId = hit.id;
              S.drag = { type: "movestruct", st: structById(hit.id), startCell: c, dx: 0, dy: 0, undone: false };
            } else if (hit && hit.type === "edge") {
              S.activeEdgeId = hit.id;
              S.drag = { type: "moveedge", es: edgeStructById(hit.id), startCell: c, dx: 0, dy: 0, undone: false };
            }
            commit(true);
            return;
          }

          if (S.tool === "spaint" || S.tool === "srect") {
            let st = alt ? null : activeStruct();
            pushUndo();
            if (!alt && (shift || !st)) {
              st = createStruct();
              S.sel = { type: "struct", id: st.id };
            }
            if (S.tool === "srect") {
              S.drag = { type: "rect", layer: "struct", a: c, b: c, st, erase: alt };
            } else {
              S.drag = { type: "paint", layer: "struct", st, erase: alt, seen: new Set() };
              applyPaint(c);
            }
            commit();
            return;
          }

          if (S.tool === "serase") {
            pushUndo();
            S.drag = { type: "paint", layer: "struct", st: null, erase: true, seen: new Set() };
            applyPaint(c);
            commit();
            return;
          }

          if (S.tool === "stamp") {
            const k = ck(c.x, c.y);
            if (alt) {
              if (stampIndex.has(k)) { pushUndo(); eraseStampCell(k); commit(); }
              return;
            }
            let st = activeStamp();
            const here = stampIndex.get(k);
            // plain click on an existing stamp selects it instead of stacking a duplicate
            if (here && !shift && (!st || here === st.id)) {
              S.sel = { type: "stamp", id: here, cell: k };
              S.activeStampId = here;
              commit(true);
              return;
            }
            pushUndo();
            if (shift || !st) st = createStamp();
            setStampCell(k, st);
            S.sel = { type: "stamp", id: st.id, cell: k };
            commit();
            return;
          }

          if (S.tool === "edge") {
            const wx = V.wx(p.x), wy = V.wy(p.y);
            const v = vertexAt(wx, wy);
            S.drag = { type: "edgeline", a: v, b: v, cur: { x: wx, y: wy }, erase: alt, fresh: shift };
            needsDraw = true;
            return;
          }

          if (S.tool === "paint" || S.tool === "rect") {
            let room = activeRoom();
            if (!alt && (shift || !room)) {
              pushUndo();
              room = createRoom();
              S.sel = { type: "room", id: room.id };
            } else pushUndo();
            if (S.tool === "rect") {
              S.drag = { type: "rect", a: c, b: c, room, erase: alt };
            } else {
              S.drag = { type: "paint", room, erase: alt, seen: new Set() };
              applyPaint(c);
            }
            commit();
            return;
          }

          if (S.tool === "erase") {
            pushUndo();
            S.drag = { type: "paint", room: null, erase: true, seen: new Set() };
            applyPaint(c);
            commit();
            return;
          }

          if (S.tool === "door") {
            const edge = nearestEdge(V.wx(p.x), V.wy(p.y), 0.5);
            if (!edge) return;
            const existing = doorAtEdge(edge.o, edge.x, edge.y);
            pushUndo();
            if (existing) {
              if (alt) deleteDoor(existing.id);
              else S.sel = { type: "door", id: existing.id };
            } else if (!alt) {
              const d = { id: uid("door"), x: edge.x, y: edge.y, o: edge.o, kind: "door", dir: 1, lockId: null };
              S.doc.doors.push(d);
              S.sel = { type: "door", id: d.id };
            }
            commit();
            return;
          }

          if (S.tool === "key") {
            pushUndo();
            const k = createKeyAt(c.x, c.y);
            S.sel = { type: "key", id: k.id };
            commit();
            return;
          }
        });

        /** Right-click remove with the Select tool: delete the smallest thing under the pointer. */
        function removeAt(V, p) {
          const hit = pickAt(V, p);
          if (!hit) return;
          const c = cellAtEvent(V, p);
          pushUndo();
          if (hit.type === "note") deleteNote(hit.id);
          else if (hit.type === "stamp") eraseStampCell(hit.cell);
          else if (hit.type === "key") deleteKey(hit.id);
          else if (hit.type === "door") deleteDoor(hit.id);
          else if (hit.type === "edge") {
            const e = nearestEdge(V.wx(p.x), V.wy(p.y), 0.16);
            if (e) clearEdge(ek(e.o, e.x, e.y));
            dropEmptyEdgeStructs();
          } else if (hit.type === "struct") {
            eraseStructCell(ck(c.x, c.y));
            dropEmptyStructs();
          } else if (hit.type === "room") {
            eraseCell(c.x, c.y);
            dropEmptyRooms();
            reindex();
            pruneDoors();
          }
          if (S.sel && !selExists(S.sel)) S.sel = null;
          commit();
        }

        function applyPaint(c) {
          const d = S.drag;
          const k = ck(c.x, c.y);
          if (d.seen.has(k)) return;
          d.seen.add(k);
          if (d.layer === "struct") {
            if (d.erase || !d.st) eraseStructCell(k);
            else setStructCell(k, d.st);
            return;
          }
          if (d.erase || !d.room) eraseCell(c.x, c.y);
          else paintCell(c.x, c.y, d.room);
        }

        /** Commit an Edge-tool gesture: a straight run of edges, or a single click on one edge. */
        function applyEdgeLine(d) {
          let keys = edgeLine(d.a, d.b);
          const click = !keys.length;
          if (click) {
            const e = nearestEdge(d.cur.x, d.cur.y, 0.5);
            if (!e) return;
            keys = [ek(e.o, e.x, e.y)];
            const owner = edgeIndex.get(keys[0]);
            // plain click on an existing edge just selects its structure
            if (owner && !d.erase && !d.fresh) {
              S.sel = { type: "edge", id: owner };
              S.activeEdgeId = owner;
              return;
            }
          }
          if (d.erase) {
            if (!keys.some((k) => edgeIndex.has(k))) return;
            pushUndo();
            keys.forEach(clearEdge);
            dropEmptyEdgeStructs();
            return;
          }
          pushUndo();
          let es = d.fresh ? null : activeEdgeStruct();
          if (!es) es = createEdgeStruct();
          keys.forEach((k) => setEdge(k, es));
          S.sel = { type: "edge", id: es.id };
          S.activeEdgeId = es.id;
          dropEmptyEdgeStructs();
        }

        worldCanvas.addEventListener("pointermove", (e) => {
          const V = makeView(S.cam, VW, VH);
          const p = evPos(e);
          const wx = V.wx(p.x), wy = V.wy(p.y);
          const c = { x: Math.floor(wx / CELL), y: Math.floor(wy / CELL) };
          $("#hud-coord").textContent = c.x + ", " + c.y;

          const prev = S.hoverCell;
          S.hoverCell = c;
          S.hoverEdge = S.tool === "door" || S.tool === "edge" ? nearestEdge(wx, wy, 0.5) : null;
          if (!S.drag && S.tool !== "pan") {
            const nh = noteHit(V, p.x, p.y);
            worldCanvas.style.cursor = nh && nh.part === "toggle" ? "pointer" : S.tool === "select" ? "default" : "crosshair";
          }
          if (!prev || prev.x !== c.x || prev.y !== c.y || S.tool === "door" || S.tool === "edge") needsDraw = true;

          const d = S.drag;
          if (!d) return;

          if (d.type === "pan") {
            S.cam.x -= (p.x - d.last.x) / S.cam.zoom;
            S.cam.y -= (p.y - d.last.y) / S.cam.zoom;
            d.last = p;
            needsDraw = true;
          } else if (d.type === "paint") {
            applyPaint(c);
            commit();
          } else if (d.type === "rect") {
            d.b = c;
            needsDraw = true;
          } else if (d.type === "move") {
            const dx = c.x - d.startCell.x, dy = c.y - d.startCell.y;
            if (dx !== d.dx || dy !== d.dy) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              translateRoom(d.room, dx - d.dx, dy - d.dy);
              d.dx = dx; d.dy = dy;
              d.moved = true;
              commit();
            }
          } else if (d.type === "movekey") {
            if (c.x !== d.key.x || c.y !== d.key.y) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              d.key.x = c.x; d.key.y = c.y;
              d.moved = true;
              commit();
            }
          } else if (d.type === "movenote") {
            if ((c.x !== d.note.x || c.y !== d.note.y) && !noteAtCell(c.x, c.y)) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              d.note.x = c.x;
              d.note.y = c.y;
              commit();
            }
          } else if (d.type === "movestamp") {
            const k = ck(c.x, c.y);
            // never stamp over a different stamp while dragging
            if (k !== d.cell && !stampIndex.has(k)) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              d.st.cells = d.st.cells.filter((z) => z !== d.cell);
              reindex();
              setStampCell(k, d.st);
              d.cell = k;
              if (S.sel && S.sel.type === "stamp") S.sel.cell = k;
              commit();
            }
          } else if (d.type === "movestruct" || d.type === "moveedge") {
            const dx = c.x - d.startCell.x, dy = c.y - d.startCell.y;
            if (dx !== d.dx || dy !== d.dy) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              if (d.type === "movestruct") translateStruct(d.st, dx - d.dx, dy - d.dy);
              else translateEdgeStruct(d.es, dx - d.dx, dy - d.dy);
              d.dx = dx; d.dy = dy;
              commit();
            }
          } else if (d.type === "edgeline") {
            d.b = vertexAt(wx, wy);
            d.cur = { x: wx, y: wy };
            needsDraw = true;
          }
        });

        function endDrag() {
          const d = S.drag;
          if (!d) return;
          if (d.type === "rect") {
            const x0 = Math.min(d.a.x, d.b.x), y0 = Math.min(d.a.y, d.b.y);
            const x1 = Math.max(d.a.x, d.b.x), y1 = Math.max(d.a.y, d.b.y);
            for (let y = y0; y <= y1; y++)
              for (let x = x0; x <= x1; x++) {
                if (d.layer === "struct") d.erase || !d.st ? eraseStructCell(ck(x, y)) : setStructCell(ck(x, y), d.st);
                else d.erase ? eraseCell(x, y) : paintCell(x, y, d.room);
              }
          }
          if (d.type === "edgeline") applyEdgeLine(d);
          if (d.layer === "struct" || d.type === "movestruct" || d.type === "move") dropEmptyStructs();
          if (d.type === "moveedge" || d.type === "move") dropEmptyEdgeStructs();
          if ((d.type === "paint" || d.type === "rect" || d.type === "move") && d.layer !== "struct") {
            dropEmptyRooms();
            reindex();
            pruneDoors();
          }
          S.drag = null;
          commit();
          flushUI();
        }
        worldCanvas.addEventListener("pointerup", endDrag);
        worldCanvas.addEventListener("pointercancel", endDrag);
        worldCanvas.addEventListener("pointerleave", () => {
          S.hoverCell = null;
          S.hoverEdge = null;
          needsDraw = true;
        });
        worldCanvas.addEventListener("dblclick", (e) => {
          const V = makeView(S.cam, VW, VH);
          const p = evPos(e);
          const hit = pickAt(V, p);
          if (hit && hit.type === "room") openDetail(hit.id);
          else if (hit && hit.type === "struct") {
            // structures sit on top of rooms — open the room underneath
            const c = cellAtEvent(V, p);
            const r = roomAtCell(c.x, c.y);
            if (r) openDetail(r.id);
          }
        });
        worldCanvas.addEventListener("contextmenu", (e) => e.preventDefault());
        worldCanvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const V = makeView(S.cam, VW, VH);
            const p = evPos(e);
            zoomAt(S.cam, p.x, p.y, Math.pow(0.999, e.deltaY), V);
            needsDraw = true;
          },
          { passive: false }
        );

        /* ══════════════════════════════════════════════════════════════
           12 · Keyboard
           ══════════════════════════════════════════════════════════════ */
        /* ── Configurable tool shortcuts (stored per browser) ──────── */
        let toolKeys = Object.assign({}, DEFAULT_TOOL_KEYS); // tool -> key
        let TOOL_KEYS = {}; // key -> tool
        const KEYS_LS = "mvmap:keys";
        /** A keydown's key as stored in the keymap: one lower-cased printable character, or a named key. */
        const normKey = (k) => (k && Array.from(k).length === 1 ? k.toLowerCase() : String(k || "").toLowerCase());
        const keyLabel = (k) =>
          k === " " ? "Space" : Array.from(k).length === 1 ? k.toUpperCase() : k.charAt(0).toUpperCase() + k.slice(1);
        const toolName = (id) => (TOOL_LIST.find((t) => t.id === id) || { name: id }).name;

        /** Why `k` can't be a tool shortcut, or null when it can. */
        function keyProblem(k) {
          if (!k) return "That isn't a key.";
          if (RESERVED_KEYS[k]) return `${keyLabel(k)} is reserved (${RESERVED_KEYS[k]}).`;
          if (Array.from(k).length !== 1 || /\s/.test(k)) return `${keyLabel(k)} can't be used — pick a letter, digit or symbol key.`;
          return null;
        }
        /** Validate a full tool -> key map; returns an error message or null. */
        function keymapProblem(map) {
          const seen = {};
          for (const t of TOOL_LIST) {
            const k = map[t.id];
            if (typeof k !== "string") return `No key for ${t.name}.`;
            const bad = keyProblem(k);
            if (bad) return `${t.name}: ${bad}`;
            if (seen[k]) return `${keyLabel(k)} is assigned to both ${toolName(seen[k])} and ${t.name}.`;
            seen[k] = t.id;
          }
          return null;
        }
        function applyToolKeys(map) {
          toolKeys = {};
          TOOL_KEYS = {};
          for (const t of TOOL_LIST) {
            toolKeys[t.id] = map[t.id];
            TOOL_KEYS[map[t.id]] = t.id;
          }
          document.querySelectorAll("#tools [data-tool]").forEach((b) => {
            const k = toolKeys[b.dataset.tool];
            const kb = b.querySelector(".kb");
            if (kb) kb.textContent = keyLabel(k);
            b.title = `${toolName(b.dataset.tool)} (${keyLabel(k)})${b.dataset.tool === "pan" ? " · or hold Space" : ""}`;
          });
        }
        function saveToolKeys() {
          try { localStorage.setItem(KEYS_LS, JSON.stringify(toolKeys)); } catch (e) {}
        }
        /** Read a stored or imported keymap: missing tools fall back to defaults, keys are normalised. */
        function readKeymap(obj) {
          const src = obj && typeof obj === "object" ? obj.keys && typeof obj.keys === "object" ? obj.keys : obj : {};
          const map = {};
          for (const t of TOOL_LIST) if (typeof src[t.id] === "string") map[t.id] = normKey(src[t.id]);
          // tools the source doesn't mention (e.g. added in a later version) get their default,
          // or the first free key if a custom binding already took it
          const used = new Set(Object.values(map));
          for (const t of TOOL_LIST) {
            if (map[t.id] !== undefined) continue;
            let k = DEFAULT_TOOL_KEYS[t.id];
            if (used.has(k)) k = Array.from("abcdefghijklmnopqrstuvwxyz0123456789").find((c) => !used.has(c) && !RESERVED_KEYS[c]);
            map[t.id] = k;
            used.add(k);
          }
          return map;
        }
        function loadToolKeys() {
          let map = DEFAULT_TOOL_KEYS;
          try {
            const raw = localStorage.getItem(KEYS_LS);
            if (raw) {
              const m = readKeymap(JSON.parse(raw));
              if (!keymapProblem(m)) map = m;
            }
          } catch (e) {}
          applyToolKeys(map);
        }

        window.addEventListener("keydown", (e) => {
          const t = e.target;
          const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);

          if (e.code === "Space" && !typing) {
            S.spaceDown = true;
            e.preventDefault();
            return;
          }
          if (typing) {
            if (e.key === "Escape") t.blur();
            return;
          }

          const mod = e.ctrlKey || e.metaKey;
          if (mod && e.key.toLowerCase() === "z") {
            e.preventDefault();
            e.shiftKey ? redo() : undo();
            return;
          }
          if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
          if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); exportJSON(); return; }
          if (mod) return;

          if (!$("#modal").hidden) {
            if (e.key === "Escape") closeModal();
            return;
          }

          if (S.detailRoomId) {
            detailKey(e);
            return;
          }

          const tk = TOOL_KEYS[e.key.toLowerCase()];
          if (tk) { setTool(tk); return; }
          if (e.key === "f") { fitWorld(); return; }
          if (e.key === "Escape") { S.sel = null; commit(true); return; }
          if (e.code === "BracketLeft" || e.code === "BracketRight") {
            const up = e.code === "BracketLeft";
            reorderSel(e.shiftKey ? (up ? "top" : "bottom") : up ? "up" : "down");
            return;
          }
          if (e.key === "Enter" && S.sel && S.sel.type === "room") { openDetail(S.sel.id); return; }
          if (e.key === "Enter" && S.sel && S.sel.type === "note") {
            const n = noteById(S.sel.id);
            if (n) { pushUndo(); n.expanded = !n.expanded; commit(); }
            return;
          }
          if (e.key === "Delete" || e.key === "Backspace") {
            if (!S.sel) return;
            pushUndo();
            if (S.sel.type === "room") deleteRoom(S.sel.id);
            else if (S.sel.type === "door") deleteDoor(S.sel.id);
            else if (S.sel.type === "key") deleteKey(S.sel.id);
            else if (S.sel.type === "lock") deleteLock(S.sel.id);
            else if (S.sel.type === "struct") deleteStruct(S.sel.id);
            else if (S.sel.type === "edge") deleteEdgeStruct(S.sel.id);
            else if (S.sel.type === "note") deleteNote(S.sel.id);
            else if (S.sel.type === "stamp") {
              // a stamp picked on the map removes just that cell; one picked from the list removes the stamp
              if (S.sel.cell && stampIndex.get(S.sel.cell) === S.sel.id) { eraseStampCell(S.sel.cell); S.sel = { type: "stamp", id: S.sel.id }; }
              else deleteStamp(S.sel.id);
            }
            commit();
          }
        });
        window.addEventListener("keyup", (e) => {
          if (e.code === "Space") S.spaceDown = false;
        });
        window.addEventListener("resize", () => { needsDraw = true; });

        function setTool(t) {
          S.tool = t;
          document.querySelectorAll("#tools .tool").forEach((b) => b.classList.toggle("on", b.dataset.tool === t));
          $("#hint").innerHTML = HINTS[t] || "";
          worldCanvas.style.cursor = t === "pan" ? "grab" : t === "select" ? "default" : "crosshair";
          needsDraw = true;
        }

        /* ══════════════════════════════════════════════════════════════
           13 · Panels
           ══════════════════════════════════════════════════════════════ */
        function renderUI() {
          renderAreas();
          renderRooms();
          renderLocks();
          renderKeys();
          renderStructs();
          renderEdgeStructs();
          renderStamps();
          renderInspector();
          $("#btn-undo").disabled = !undoStack.length;
          $("#btn-redo").disabled = !redoStack.length;
          if ($("#map-name").value !== S.doc.name && document.activeElement !== $("#map-name"))
            $("#map-name").value = S.doc.name;
        }

        function renderAreas() {
          const host = $("#area-list");
          const active = activeArea();
          // Never blow away a name field that's mid-edit — just refresh the active highlight.
          const focused = document.activeElement;
          if (focused && focused.closest && focused.closest("#area-list [data-rename]")) {
            host.querySelectorAll("[data-area]").forEach((row) =>
              row.classList.toggle("on", row.dataset.area === active.id)
            );
            return;
          }
          host.innerHTML = S.doc.areas
            .map(
              (a) => `<div class="row ${a.id === active.id ? "on" : ""}" data-area="${a.id}">
                 <button class="swatch" data-swatch="${a.id}" style="background:${a.color}" title="Change colour"></button>
                 <input class="nm-edit" data-rename="${a.id}" value="${esc(a.name)}" spellcheck="false" />
                 <span class="sub">${S.doc.rooms.filter((r) => r.areaId === a.id).length}</span>
                 ${S.doc.areas.length > 1 ? `<button class="mini" data-delarea="${a.id}" title="Delete area">×</button>` : ""}
               </div>`
            )
            .join("");
        }

        function renderRooms() {
          const host = $("#room-list");
          $("#room-count").textContent = S.doc.rooms.length;
          $("#btn-add-room").title = "New room in " + activeArea().name;
          if (!S.doc.rooms.length) {
            host.innerHTML = `<div class="empty">Hit + to start a room, then drag on the grid to paint its cells.</div>`;
            return;
          }
          const selId = S.sel && S.sel.type === "room" ? S.sel.id : null;
          const byArea = new Map();
          S.doc.rooms.forEach((r) => {
            if (!byArea.has(r.areaId)) byArea.set(r.areaId, []);
            byArea.get(r.areaId).push(r);
          });
          let html = "";
          for (const a of S.doc.areas) {
            const list = byArea.get(a.id);
            if (!list || !list.length) continue;
            html += `<div class="grp" style="color:${a.color}">${esc(a.name)}</div>`;
            html += list
              .map(
                (r) => `<div class="row ${r.id === selId ? "on" : ""}" data-room="${r.id}">
                   <span class="swatch" style="background:${roomColor(r)}"></span>
                   <span class="nm">${esc(r.name)}</span>
                   <span class="sub">${r.cells.length}</span>
                 </div>`
              )
              .join("");
          }
          host.innerHTML = html;
        }

        function renderLocks() {
          const host = $("#lock-list");
          if (!S.doc.locks.length) {
            host.innerHTML = `<div class="empty">No locks yet. Place a door, then give it a lock.</div>`;
            return;
          }
          const selId = S.sel && S.sel.type === "lock" ? S.sel.id : null;
          host.innerHTML = S.doc.locks
            .map((l) => {
              const doors = S.doc.doors.filter((d) => d.lockId === l.id).length;
              const keys = l.keyIds.filter((k) => keyById(k)).length;
              return `<div class="row ${l.id === selId ? "on" : ""}" data-lock="${l.id}">
                  <span class="swatch" style="background:${l.color}"></span>
                  <span class="nm">${esc(l.name)}</span>
                  <span class="sub" title="${doors} door(s) · ${keys} key(s)">${doors}⌗ ${keys}✦</span>
                </div>`;
            })
            .join("");
        }

        function renderKeys() {
          const host = $("#key-list");
          $("#key-count").textContent = S.doc.keys.length;
          if (!S.doc.keys.length) {
            host.innerHTML = `<div class="empty">No keys yet. Use the Key tool on a cell.</div>`;
            return;
          }
          const selId = S.sel && S.sel.type === "key" ? S.sel.id : null;
          host.innerHTML = S.doc.keys
            .map((k) => {
              const r = roomAtCell(k.x, k.y);
              return `<div class="row ${k.id === selId ? "on" : ""}" data-key="${k.id}">
                  <span class="swatch rnd" style="background:${k.color}"></span>
                  <span class="nm">${esc(k.name)}</span>
                  <span class="sub">${r ? esc(r.name) : k.x + "," + k.y}</span>
                </div>`;
            })
            .join("");
        }

        function renderStructs() {
          const host = $("#struct-list");
          $("#struct-count").textContent = S.doc.structures.length;
          if (!S.doc.structures.length) {
            host.innerHTML = `<div class="empty">Walls, hidden walls, mechanisms… Hit + or use S-Paint / S-Rect on the grid.</div>`;
            return;
          }
          const selId = S.sel && S.sel.type === "struct" ? S.sel.id : null;
          host.innerHTML = S.doc.structures
            .map(
              (s) => `<div class="row ${s.id === selId ? "on" : ""}" data-struct="${s.id}">
                  <span class="swatch" style="background:${structColor(s)}"></span>
                  <span class="nm">${esc(s.name)}${s.id === S.activeStructId && s.id !== selId ? ' <span class="sub">· active</span>' : ""}</span>
                  <span class="sub">${s.cells.length}</span>
                </div>`
            )
            .join("");
        }

        function renderEdgeStructs() {
          const host = $("#edge-list");
          $("#edge-count").textContent = S.doc.edgeStructs.length;
          if (!S.doc.edgeStructs.length) {
            host.innerHTML = `<div class="empty">Platforms and ledges. Hit + or use the Edge tool and drag along grid lines.</div>`;
            return;
          }
          const selId = S.sel && S.sel.type === "edge" ? S.sel.id : null;
          host.innerHTML = S.doc.edgeStructs
            .map(
              (s) => `<div class="row ${s.id === selId ? "on" : ""}" data-edge="${s.id}">
                  <span class="swatch" style="background:${structColor(s)};height:4px;border-radius:2px"></span>
                  <span class="nm">${esc(s.name)}${s.id === S.activeEdgeId && s.id !== selId ? ' <span class="sub">· active</span>' : ""}</span>
                  <span class="sub">${s.edges.length}</span>
                </div>`
            )
            .join("");
        }

        function renderStamps() {
          const host = $("#stamp-list");
          $("#stamp-count").textContent = S.doc.stamps.length;
          if (!S.doc.stamps.length) {
            host.innerHTML = `<div class="empty">Emoji markers for single cells — save points, items, bosses… Hit + or use the Stamp tool.</div>`;
            return;
          }
          const selId = S.sel && S.sel.type === "stamp" ? S.sel.id : null;
          host.innerHTML = S.doc.stamps
            .map(
              (s) => `<div class="row ${s.id === selId ? "on" : ""}" data-stamp="${s.id}">
                  <span class="emo">${esc(s.emoji)}</span>
                  <span class="nm">${esc(s.name)}${s.id === S.activeStampId && s.id !== selId ? ' <span class="sub">· active</span>' : ""}</span>
                  <span class="sub">${s.cells.length}</span>
                </div>`
            )
            .join("");
        }

        /* ── Inspector ─────────────────────────────────────────────── */
        function renderInspector() {
          const host = $("#inspector");
          if (!S.sel || !selExists(S.sel)) {
            const r = activeRoom();
            const st = structById(S.activeStructId), es = edgeStructById(S.activeEdgeId);
            host.innerHTML = `<div class="meta">Nothing selected.${
              r ? ` Painting into <b style="color:${roomColor(r)}">${esc(r.name)}</b>.` : ""
            }${st ? ` Structure tools draw into <b style="color:${structColor(st)}">${esc(st.name)}</b>.` : ""}${
              es ? ` Edge tool draws into <b style="color:${structColor(es)}">${esc(es.name)}</b>.` : ""
            }<br /><br />Select a room to rename, recolour, or grey-box it. Select a door to lock it. Select a lock to see which keys open it. Select a structure or edge structure to rename or recolour it.</div>`;
            return;
          }
          const t = S.sel.type;
          if (t === "struct") inspectStruct(host, structById(S.sel.id));
          else if (t === "edge") inspectEdgeStruct(host, edgeStructById(S.sel.id));
          else if (t === "stamp") inspectStamp(host, stampById(S.sel.id));
          else if (t === "note") inspectNote(host, noteById(S.sel.id));
          else if (t === "room") inspectRoom(host, roomById(S.sel.id));
          else if (t === "door") inspectDoor(host, S.doc.doors.find((d) => d.id === S.sel.id));
          else if (t === "key") inspectKey(host, keyById(S.sel.id));
          else if (t === "lock") inspectLock(host, lockById(S.sel.id));
          decorateInspector(host);
        }

        /** Shared extras slotted in above the inspector's action buttons: name visibility and list order. */
        function decorateInspector(host) {
          let sc = orderScope(S.sel);
          // notes stand alone: no list to order, but they still have a name to show or hide
          const item = sc ? sc.item : S.sel.type === "note" ? noteById(S.sel.id) : null;
          if (!item) return;
          const named = ["room", "struct", "edge", "stamp", "key", "note"].includes(S.sel.type);
          let html = "";
          if (named) {
            html += `<label class="check"><input type="checkbox" id="i-showname" ${item.hideName ? "" : "checked"} />
              <span>Show name on map</span></label>`;
          }
          const n = sc ? sc.peers.length : 0, pos = sc ? sc.pos : 0;
          if (sc) html += `<div class="fld"><label>Order${S.sel.type === "room" ? " in area" : ""}</label>
            <div class="ord">
              <button data-ord="top" title="Move to top (Shift+[)" ${pos === 0 ? "disabled" : ""}>⤒</button>
              <button data-ord="up" title="Move up ([)" ${pos === 0 ? "disabled" : ""}>↑</button>
              <span class="pos">${pos + 1} / ${n}</span>
              <button data-ord="down" title="Move down (])" ${pos === n - 1 ? "disabled" : ""}>↓</button>
              <button data-ord="bottom" title="Move to bottom (Shift+])" ${pos === n - 1 ? "disabled" : ""}>⤓</button>
            </div></div>`;
          const wrap = document.createElement("div");
          wrap.className = "inspector";
          wrap.innerHTML = html;
          const actions = host.querySelector(".btn-row:last-child");
          host.insertBefore(wrap, actions || null);
          const sn = $("#i-showname");
          if (sn) sn.onchange = () => {
            pushUndo();
            if (sn.checked) delete item.hideName;
            else item.hideName = true;
            commit();
          };
          wrap.querySelectorAll("[data-ord]").forEach((b) => (b.onclick = () => reorderSel(b.dataset.ord)));
        }

        const colorChips = (colors, current, attr) =>
          `<div class="chips">${colors
            .map((c) => `<button class="chip ${c === current ? "on" : ""}" style="background:${c}" data-${attr}="${c}"></button>`)
            .join("")}</div>`;

        function inspectRoom(host, r) {
          const b = roomBBox(r);
          const det = S.doc.detail[r.id];
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${roomColor(r)}"></span>
              <span class="kind">Room</span></div>
            <div class="fld"><label>Name</label><input type="text" id="i-name" value="${esc(r.name)}" /></div>
            <div class="fld"><label>Area</label><select id="i-area">${S.doc.areas
              .map((a) => `<option value="${a.id}" ${a.id === r.areaId ? "selected" : ""}>${esc(a.name)}</option>`)
              .join("")}</select></div>
            <div class="fld"><label>Colour override</label>
              ${colorChips(AREA_COLORS, r.color, "color")}
              <button class="btn" id="i-clear-color" style="margin-top:4px">Use area colour</button>
            </div>
            <div class="fld"><label>Notes</label><textarea id="i-notes" placeholder="Design notes, enemies, secrets…">${esc(r.notes)}</textarea></div>
            <div class="meta">${r.cells.length} cells · ${b ? b.w + "×" + b.h : "—"} at ${b ? b.x0 + "," + b.y0 : "—"}${
            det && det.boxes.length ? ` · ${det.boxes.length} greybox shapes` : ""
          }</div>
            <div class="btn-row">
              <button class="btn primary" id="i-detail">Grey-box…</button>
              <button class="btn danger" id="i-del">Delete</button>
            </div>`;

          $("#i-name").oninput = (e) => { r.name = e.target.value; needsDraw = true; renderRooms(); scheduleSave(); };
          undoOnFocus($("#i-name"), $("#i-notes"));
          $("#i-area").onchange = (e) => { pushUndo(); r.areaId = e.target.value; S.activeAreaId = r.areaId; commit(); };
          $("#i-notes").oninput = (e) => { r.notes = e.target.value; scheduleSave(); };
          $("#i-clear-color").onclick = () => { pushUndo(); r.color = null; commit(); };
          $("#i-detail").onclick = () => openDetail(r.id);
          $("#i-del").onclick = () => { pushUndo(); deleteRoom(r.id); commit(); };
          host.querySelectorAll("[data-color]").forEach((b2) => {
            b2.onclick = () => { pushUndo(); r.color = b2.dataset.color; commit(); };
          });
        }

        function inspectDoor(host, d) {
          if (!d) return;
          const lock = d.lockId ? lockById(d.lockId) : null;
          const cells = edgeCells(d).map(([x, y]) => roomAtCell(x, y));
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${lock ? lock.color : "#93a0b4"}"></span>
              <span class="kind">Door</span></div>
            <div class="fld"><label>Type</label>
              <div class="seg" id="i-kind">
                <button data-kind="passage" class="${d.kind === "passage" ? "on" : ""}">Passage</button>
                <button data-kind="door" class="${d.kind === "door" ? "on" : ""}">Door</button>
                <button data-kind="oneway" class="${d.kind === "oneway" ? "on" : ""}">One-way</button>
              </div>
            </div>
            ${
              d.kind === "oneway"
                ? `<div class="fld"><label>Direction</label><button class="btn" id="i-flip">Passable ${
                    d.o === "v" ? (d.dir === 1 ? "→ east" : "← west") : d.dir === 1 ? "↓ south" : "↑ north"
                  } — flip</button></div>`
                : ""
            }
            <div class="fld"><label>Lock</label>
              <select id="i-lock">
                <option value="">— unlocked —</option>
                ${S.doc.locks.map((l) => `<option value="${l.id}" ${l.id === d.lockId ? "selected" : ""}>${esc(l.name)}</option>`).join("")}
                <option value="__new">+ New lock…</option>
              </select>
            </div>
            ${
              lock
                ? `<div class="fld"><label>Opened by</label>${keyToggleList(lock)}</div>
                   <button class="btn" id="i-sel-lock">Select lock “${esc(lock.name)}”</button>`
                : ""
            }
            <div class="meta">Between ${cells.map((c) => (c ? esc(c.name) : "void")).join(" ↔ ")}</div>
            <div class="btn-row"><button class="btn danger" id="i-del">Delete door</button></div>`;

          host.querySelectorAll("#i-kind button").forEach((b) => {
            b.onclick = () => { pushUndo(); d.kind = b.dataset.kind; commit(); };
          });
          const flip = $("#i-flip");
          if (flip) flip.onclick = () => { pushUndo(); d.dir = -d.dir; commit(); };
          $("#i-lock").onchange = (e) => {
            pushUndo();
            if (e.target.value === "__new") { const l = createLock(); d.lockId = l.id; }
            else d.lockId = e.target.value || null;
            commit();
          };
          const sl = $("#i-sel-lock");
          if (sl) sl.onclick = () => { S.sel = { type: "lock", id: lock.id }; commit(true); };
          bindKeyToggles(host, lock);
          $("#i-del").onclick = () => { pushUndo(); deleteDoor(d.id); commit(); };
        }

        function keyToggleList(lock) {
          if (!S.doc.keys.length) return `<div class="meta">No keys exist yet — place one with the Key tool.</div>`;
          return `<div class="link-list">${S.doc.keys
            .map(
              (k) => `<label class="check"><input type="checkbox" data-keytoggle="${k.id}" ${
                lock.keyIds.includes(k.id) ? "checked" : ""
              } /><span class="swatch rnd" style="background:${k.color}"></span><span>${esc(k.name)}</span></label>`
            )
            .join("")}</div>`;
        }
        function bindKeyToggles(host, lock) {
          if (!lock) return;
          host.querySelectorAll("[data-keytoggle]").forEach((cb) => {
            cb.onchange = () => {
              pushUndo();
              const id = cb.dataset.keytoggle;
              if (cb.checked) { if (!lock.keyIds.includes(id)) lock.keyIds.push(id); }
              else lock.keyIds = lock.keyIds.filter((x) => x !== id);
              commit();
            };
          });
        }

        function inspectKey(host, k) {
          if (!k) return;
          const room = roomAtCell(k.x, k.y);
          const opens = S.doc.locks.filter((l) => l.keyIds.includes(k.id));
          host.innerHTML = `
            <div class="insp-title"><span class="swatch rnd" style="background:${k.color}"></span>
              <span class="kind">Key</span></div>
            <div class="fld"><label>Name</label><input type="text" id="i-name" value="${esc(k.name)}" placeholder="Double Jump, Red Key…" /></div>
            <div class="fld"><label>Colour</label>${colorChips(LOCK_COLORS, k.color, "kcolor")}</div>
            <div class="fld"><label>Opens</label>
              ${
                S.doc.locks.length
                  ? `<div class="link-list">${S.doc.locks
                      .map(
                        (l) => `<label class="check"><input type="checkbox" data-locktoggle="${l.id}" ${
                          l.keyIds.includes(k.id) ? "checked" : ""
                        } /><span class="swatch" style="background:${l.color}"></span><span>${esc(l.name)}</span></label>`
                      )
                      .join("")}</div>`
                  : `<div class="meta">No locks yet.</div>`
              }
            </div>
            <div class="meta">Cell ${k.x}, ${k.y}${room ? " · in " + esc(room.name) : ""} · opens ${opens.length} lock(s)</div>
            <div class="btn-row"><button class="btn danger" id="i-del">Delete key</button></div>`;

          $("#i-name").oninput = (e) => { k.name = e.target.value; needsDraw = true; renderKeys(); scheduleSave(); };
          undoOnFocus($("#i-name"));
          host.querySelectorAll("[data-kcolor]").forEach((b) => {
            b.onclick = () => { pushUndo(); k.color = b.dataset.kcolor; commit(); };
          });
          host.querySelectorAll("[data-locktoggle]").forEach((cb) => {
            cb.onchange = () => {
              pushUndo();
              const l = lockById(cb.dataset.locktoggle);
              if (cb.checked) { if (!l.keyIds.includes(k.id)) l.keyIds.push(k.id); }
              else l.keyIds = l.keyIds.filter((x) => x !== k.id);
              commit();
            };
          });
          $("#i-del").onclick = () => { pushUndo(); deleteKey(k.id); commit(); };
        }

        function inspectLock(host, l) {
          if (!l) return;
          const doors = S.doc.doors.filter((d) => d.lockId === l.id);
          const keys = l.keyIds.map(keyById).filter(Boolean);
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${l.color}"></span>
              <span class="kind">Lock</span></div>
            <div class="fld"><label>Name</label><input type="text" id="i-name" value="${esc(l.name)}" placeholder="Grapple gate…" /></div>
            <div class="fld"><label>Colour</label>${colorChips(LOCK_COLORS, l.color, "lcolor")}</div>
            <div class="fld"><label>Opened by any of</label>${keyToggleList(l)}</div>
            <div class="meta">${doors.length} door(s) use this lock · ${keys.length} key(s) open it${
            doors.length && !keys.length ? ` · <span style="color:#e0a13a">soft-locked: no key assigned</span>` : ""
          }</div>
            <div class="btn-row"><button class="btn danger" id="i-del">Delete lock</button></div>`;

          $("#i-name").oninput = (e) => { l.name = e.target.value; renderLocks(); scheduleSave(); };
          undoOnFocus($("#i-name"));
          host.querySelectorAll("[data-lcolor]").forEach((b) => {
            b.onclick = () => { pushUndo(); l.color = b.dataset.lcolor; commit(); };
          });
          bindKeyToggles(host, l);
          $("#i-del").onclick = () => { pushUndo(); deleteLock(l.id); commit(); };
        }

        /** Shared inspector for structures and edge structures — both are a named, coloured set. */
        function inspectLayerItem(host, it, isEdge) {
          if (!it) return;
          const col = structColor(it);
          const count = isEdge ? it.edges.length : it.cells.length;
          const b = isEdge
            ? null
            : cellsBBox(it.cells);
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${col}${isEdge ? ";height:4px;border-radius:2px" : ""}"></span>
              <span class="kind">${isEdge ? "Edge structure" : "Structure"}</span></div>
            <div class="fld"><label>Name</label><input type="text" id="i-name" value="${esc(it.name)}" placeholder="${
              isEdge ? "One-way platform, ledge…" : "Breakable wall, hidden wall, lever…"
            }" /></div>
            <div class="fld"><label>Colour</label>${colorChips(STRUCT_COLORS, it.color, "scolor")}
              <div class="color-row"><input type="color" id="i-ccolor" value="${/^#[0-9a-f]{6}$/i.test(col) ? col : "#b8c0cc"}" /><span>Custom colour</span></div>
            </div>
            <div class="fld"><label>Notes</label><textarea id="i-notes" placeholder="Behaviour, trigger, what opens it…">${esc(it.notes)}</textarea></div>
            <div class="meta">${count} ${isEdge ? "edge(s)" : "cell(s)"}${b ? ` · ${b.w}×${b.h} at ${b.x0},${b.y0}` : ""}${
              (isEdge ? S.activeEdgeId : S.activeStructId) === it.id ? " · active drawing target" : ""
            }</div>
            <div class="btn-row">
              <button class="btn primary" id="i-draw">${isEdge ? "Draw edges" : "Paint into"}</button>
              <button class="btn danger" id="i-del">Delete</button>
            </div>`;

          const refreshList = () => (isEdge ? renderEdgeStructs() : renderStructs());
          $("#i-name").oninput = (e) => { it.name = e.target.value; needsDraw = true; refreshList(); scheduleSave(); };
          $("#i-notes").oninput = (e) => { it.notes = e.target.value; scheduleSave(); };
          undoOnFocus($("#i-name"), $("#i-notes"), $("#i-ccolor"));
          host.querySelectorAll("[data-scolor]").forEach((b2) => {
            b2.onclick = () => { pushUndo(); it.color = b2.dataset.scolor; commit(); };
          });
          // live preview while the picker is open; rebuild the panel once it closes
          $("#i-ccolor").oninput = (e) => { it.color = e.target.value; needsDraw = true; refreshList(); scheduleSave(); };
          $("#i-ccolor").onchange = () => commit();
          $("#i-draw").onclick = () => {
            if (isEdge) { S.activeEdgeId = it.id; setTool("edge"); }
            else { S.activeStructId = it.id; setTool(S.tool === "srect" ? "srect" : "spaint"); }
            commit(true);
          };
          $("#i-del").onclick = () => {
            pushUndo();
            isEdge ? deleteEdgeStruct(it.id) : deleteStruct(it.id);
            commit();
          };
        }
        const inspectStruct = (host, s) => inspectLayerItem(host, s, false);
        const inspectEdgeStruct = (host, s) => inspectLayerItem(host, s, true);

        function inspectNote(host, n) {
          if (!n) return;
          const col = n.color || NOTE_COLORS[0];
          const room = roomAtCell(n.x, n.y);
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${col}"></span><span class="kind">Note</span></div>
            <div class="fld"><label>Label</label><input type="text" id="i-name" value="${esc(n.name)}" placeholder="Shown under the note" /></div>
            <div class="fld"><label>Details</label><textarea id="i-ntext" placeholder="What the expanded note says…">${esc(n.text)}</textarea></div>
            <div class="fld"><label>Colour</label>${colorChips(NOTE_COLORS, n.color, "ncolor")}
              <div class="color-row"><input type="color" id="i-ccolor" value="${/^#[0-9a-f]{6}$/i.test(col) ? col : "#f0dc3a"}" /><span>Custom colour</span></div>
            </div>
            <button class="btn" id="i-expand">${n.expanded ? "▴ Collapse" : "▾ Expand"} on map</button>
            <div class="meta">Cell ${n.x}, ${n.y}${room ? " · in " + esc(room.name) : ""} · <kbd>Enter</kbd> expands / collapses</div>
            <div class="btn-row"><button class="btn danger" id="i-del">Delete note</button></div>`;

          $("#i-name").oninput = (e) => { n.name = e.target.value; needsDraw = true; scheduleSave(); };
          $("#i-ntext").oninput = (e) => { n.text = e.target.value; needsDraw = true; scheduleSave(); };
          undoOnFocus($("#i-name"), $("#i-ntext"), $("#i-ccolor"));
          host.querySelectorAll("[data-ncolor]").forEach((b) => {
            b.onclick = () => { pushUndo(); n.color = b.dataset.ncolor; commit(); };
          });
          $("#i-ccolor").oninput = (e) => { n.color = e.target.value; needsDraw = true; scheduleSave(); };
          $("#i-ccolor").onchange = () => commit();
          $("#i-expand").onclick = () => { pushUndo(); n.expanded = !n.expanded; commit(); };
          $("#i-del").onclick = () => { pushUndo(); deleteNote(n.id); commit(); };
        }

        function inspectStamp(host, st) {
          if (!st) return;
          const col = structColor(st);
          const cell = S.sel && S.sel.cell && stampIndex.get(S.sel.cell) === st.id ? S.sel.cell : null;
          const room = cell ? roomAtCell(...unck(cell)) : null;
          host.innerHTML = `
            <div class="insp-title"><span class="emo">${esc(st.emoji)}</span><span class="kind">Stamp</span></div>
            <div class="fld"><label>Name</label><input type="text" id="i-name" value="${esc(st.name)}" placeholder="Save point, boss, chest…" /></div>
            <div class="fld"><label>Emoji</label>
              <input type="text" id="i-emoji" value="${esc(st.emoji)}" placeholder="One emoji (Win + .)" autocomplete="off" spellcheck="false" />
              <div class="emoji-grid" style="margin-top:4px">${STAMP_EMOJI.map(
                (e) => `<button data-emoji="${esc(e)}" class="${e === st.emoji ? "on" : ""}">${e}</button>`
              ).join("")}</div>
            </div>
            <div class="fld"><label>Tile colour</label>${colorChips(STRUCT_COLORS, st.color, "scolor")}
              <div class="color-row"><input type="color" id="i-ccolor" value="${/^#[0-9a-f]{6}$/i.test(col) ? col : "#b8c0cc"}" /><span>Custom colour</span></div>
            </div>
            <div class="fld"><label>Notes</label><textarea id="i-notes" placeholder="What is here, when it appears…">${esc(st.notes)}</textarea></div>
            <div class="meta">Placed on ${st.cells.length} cell(s)${cell ? ` · this one at ${cell}${room ? " in " + esc(room.name) : ""}` : ""}${
              S.activeStampId === st.id ? " · active stamp" : ""
            }</div>
            <div class="btn-row">
              <button class="btn primary" id="i-draw">Stamp with it</button>
              ${cell ? `<button class="btn" id="i-del-one">Remove this</button>` : ""}
              <button class="btn danger" id="i-del">Delete</button>
            </div>`;

          $("#i-name").oninput = (e) => { st.name = e.target.value; needsDraw = true; renderStamps(); scheduleSave(); };
          $("#i-notes").oninput = (e) => { st.notes = e.target.value; scheduleSave(); };
          // exactly one emoji: typing or pasting replaces the current one, anything else is dropped
          const emo = $("#i-emoji");
          emo.addEventListener("focus", () => emo.select());
          const takeEmoji = () => {
            const g = pickEmoji(emo.value);
            if (g) st.emoji = g;
            if (emo.value !== st.emoji) emo.value = st.emoji;
            emo.select();
            const t = host.querySelector(".insp-title .emo");
            if (t) t.textContent = st.emoji;
            host.querySelectorAll("[data-emoji]").forEach((b) => b.classList.toggle("on", b.dataset.emoji === st.emoji));
            needsDraw = true;
            renderStamps();
            scheduleSave();
          };
          emo.oninput = (e) => { if (!e.isComposing) takeEmoji(); };
          emo.addEventListener("compositionend", takeEmoji);
          emo.addEventListener("blur", () => { if (emo.value !== st.emoji) emo.value = st.emoji; });
          undoOnFocus($("#i-name"), $("#i-notes"), $("#i-emoji"), $("#i-ccolor"));
          host.querySelectorAll("[data-emoji]").forEach((b) => {
            b.onclick = () => { pushUndo(); st.emoji = b.dataset.emoji; commit(); };
          });
          host.querySelectorAll("[data-scolor]").forEach((b) => {
            b.onclick = () => { pushUndo(); st.color = b.dataset.scolor; commit(); };
          });
          $("#i-ccolor").oninput = (e) => { st.color = e.target.value; needsDraw = true; scheduleSave(); };
          $("#i-ccolor").onchange = () => commit();
          $("#i-draw").onclick = () => { S.activeStampId = st.id; setTool("stamp"); commit(true); };
          const one = $("#i-del-one");
          if (one) one.onclick = () => { pushUndo(); eraseStampCell(cell); S.sel = { type: "stamp", id: st.id }; commit(); };
          $("#i-del").onclick = () => { pushUndo(); deleteStamp(st.id); commit(); };
        }

        /** Text fields mutate on every keystroke — take one undo snapshot per editing session. */
        function undoOnFocus() {
          for (const el of arguments) if (el) el.addEventListener("focus", () => pushUndo());
        }

        /* ── Panel event delegation ────────────────────────────────── */
        $("#tools").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tool]");
          if (b) setTool(b.dataset.tool);
        });

        $("#area-list").addEventListener("click", (e) => {
          const sw = e.target.closest("[data-swatch]");
          if (sw) {
            const a = areaById(sw.dataset.swatch);
            pushUndo();
            a.color = AREA_COLORS[(AREA_COLORS.indexOf(a.color) + 1) % AREA_COLORS.length];
            commit();
            return;
          }
          const del = e.target.closest("[data-delarea]");
          if (del) {
            const id = del.dataset.delarea;
            if (S.doc.areas.length < 2) return;
            pushUndo();
            S.doc.areas = S.doc.areas.filter((a) => a.id !== id);
            const fallback = S.doc.areas[0].id;
            S.doc.rooms.forEach((r) => { if (r.areaId === id) r.areaId = fallback; });
            if (S.activeAreaId === id) S.activeAreaId = fallback;
            commit();
            return;
          }
          const row = e.target.closest("[data-area]");
          if (row) { setActiveArea(row.dataset.area); commit(true); }
        });
        $("#area-list").addEventListener("input", (e) => {
          const inp = e.target.closest("[data-rename]");
          if (!inp) return;
          areaById(inp.dataset.rename).name = inp.value;
          needsDraw = true;
          renderRooms();
          scheduleSave();
        });

        $("#room-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-room]");
          if (!row) return;
          const r = roomById(row.dataset.room);
          S.sel = { type: "room", id: r.id };
          S.activeRoomId = r.id;
          S.activeAreaId = r.areaId;
          commit(true);
        });
        $("#room-list").addEventListener("dblclick", (e) => {
          const row = e.target.closest("[data-room]");
          if (row) openDetail(row.dataset.room);
        });
        $("#lock-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-lock]");
          if (row) { S.sel = { type: "lock", id: row.dataset.lock }; commit(true); }
        });
        $("#key-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-key]");
          if (!row) return;
          S.sel = { type: "key", id: row.dataset.key };
          const k = keyById(row.dataset.key);
          if (k) { S.cam.x = k.x * CELL + CELL / 2; S.cam.y = k.y * CELL + CELL / 2; }
          commit(true);
        });

        function focusCells(cells) {
          const b = cellsBBox(cells);
          if (!b) return;
          S.cam.x = (b.x0 + b.w / 2) * CELL;
          S.cam.y = (b.y0 + b.h / 2) * CELL;
        }
        $("#struct-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-struct]");
          if (!row) return;
          S.sel = { type: "struct", id: row.dataset.struct };
          S.activeStructId = row.dataset.struct;
          commit(true);
        });
        $("#struct-list").addEventListener("dblclick", (e) => {
          const row = e.target.closest("[data-struct]");
          const st = row && structById(row.dataset.struct);
          if (st) { focusCells(st.cells); needsDraw = true; }
        });
        $("#edge-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-edge]");
          if (!row) return;
          S.sel = { type: "edge", id: row.dataset.edge };
          S.activeEdgeId = row.dataset.edge;
          commit(true);
        });
        $("#edge-list").addEventListener("dblclick", (e) => {
          const row = e.target.closest("[data-edge]");
          const es = row && edgeStructById(row.dataset.edge);
          if (es) {
            const cells = [];
            es.edges.forEach((k) => edgeCells(unek(k)).forEach(([x, y]) => cells.push(ck(x, y))));
            focusCells(cells);
            needsDraw = true;
          }
        });
        $("#stamp-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-stamp]");
          if (!row) return;
          S.sel = { type: "stamp", id: row.dataset.stamp };
          S.activeStampId = row.dataset.stamp;
          commit(true);
        });
        $("#stamp-list").addEventListener("dblclick", (e) => {
          const row = e.target.closest("[data-stamp]");
          const st = row && stampById(row.dataset.stamp);
          if (st) { focusCells(st.cells); needsDraw = true; }
        });
        $("#btn-add-stamp").onclick = () => {
          pushUndo();
          const st = createStamp();
          S.sel = { type: "stamp", id: st.id };
          setTool("stamp");
          commit();
        };
        $("#btn-add-struct").onclick = () => {
          pushUndo();
          const st = createStruct();
          S.sel = { type: "struct", id: st.id };
          if (S.tool !== "spaint" && S.tool !== "srect") setTool("spaint");
          commit();
        };
        $("#btn-add-edge").onclick = () => {
          pushUndo();
          const es = createEdgeStruct();
          S.sel = { type: "edge", id: es.id };
          setTool("edge");
          commit();
        };
        $("#chk-structs").onchange = (e) => { S.showStructs = e.target.checked; needsDraw = true; };
        $("#chk-slabels").onchange = (e) => { S.showStructLabels = e.target.checked; needsDraw = true; };
        $("#chk-notes").onchange = (e) => { S.showNotes = e.target.checked; needsDraw = true; };
        // a per-browser preference, not part of the map document
        $("#sel-rclick").onchange = (e) => {
          S.rclick = e.target.value === "pan" ? "pan" : "remove";
          try { localStorage.setItem("mvmap:rclick", S.rclick); } catch (err) {}
        };

        /** Open a fresh, empty room in `areaId` and arm the Paint tool on it. */
        function startNewRoom(areaId) {
          S.activeRoomId = null;
          S.sel = null;
          const r = createRoom(areaId);
          S.sel = { type: "room", id: r.id };
          setTool("paint");
          return r;
        }
        $("#btn-add-area").onclick = () => {
          pushUndo();
          const a = {
            id: uid("area"),
            name: "Area " + (S.doc.areas.length + 1),
            color: AREA_COLORS[S.doc.areas.length % AREA_COLORS.length],
          };
          S.doc.areas.push(a);
          S.activeAreaId = a.id;
          startNewRoom(a.id);
          commit();
        };
        $("#btn-add-room").onclick = () => {
          pushUndo();
          startNewRoom(activeArea().id);
          commit();
        };
        $("#btn-add-lock").onclick = () => {
          pushUndo();
          const l = createLock();
          S.sel = { type: "lock", id: l.id };
          commit();
        };
        $("#chk-flow").onchange = (e) => { S.showFlow = e.target.checked; needsDraw = true; };
        $("#chk-labels").onchange = (e) => { S.showLabels = e.target.checked; needsDraw = true; };
        $("#btn-fit").onclick = fitWorld;
        $("#btn-undo").onclick = undo;
        $("#btn-redo").onclick = redo;
        $("#map-name").oninput = (e) => { S.doc.name = e.target.value; scheduleSave(); };
        $("#map-name").addEventListener("focus", () => pushUndo());
        $("#area-list").addEventListener("focusin", (e) => {
          if (e.target.matches("[data-rename]")) pushUndo();
        });

        /* ══════════════════════════════════════════════════════════════
           14 · Grey-box (room detail) editor
           ══════════════════════════════════════════════════════════════ */
        const dCanvas = $("#detail-canvas");
        const dctx = dCanvas.getContext("2d");
        let DW = 0, DH = 0;

        function detailData(roomId) {
          if (!S.doc.detail[roomId]) S.doc.detail[roomId] = { sub: 8, boxes: [] };
          const d = S.doc.detail[roomId];
          if (!Array.isArray(d.boxes)) d.boxes = [];
          if (!d.sub) d.sub = 8;
          return d;
        }
        function openDetail(roomId) {
          const room = roomById(roomId);
          if (!room || !room.cells.length) return;
          S.detailRoomId = roomId;
          S.dsel = null;
          const det = detailData(roomId);
          $("#detail-sub").value = String(det.sub);
          $("#detail-title").textContent = room.name;
          $("#detail").hidden = false;
          setDTool(S.dtool);
          renderTypePalette();
          fitDetail();
          needsDraw = true;
        }
        function closeDetail() {
          S.detailRoomId = null;
          S.dsel = null;
          $("#detail").hidden = true;
          $("#detail-inspector").hidden = true;
          needsDraw = true;
        }
        function fitDetail() {
          const room = roomById(S.detailRoomId);
          const det = detailData(S.detailRoomId);
          const b = roomBBox(room);
