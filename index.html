          if (!b) return;
          const r = dCanvas.getBoundingClientRect();
          DW = Math.max(1, Math.round(r.width));
          DH = Math.max(1, Math.round(r.height));
          const pw = b.w * det.sub * DCELL, ph = b.h * det.sub * DCELL;
          S.dcam.x = (b.x0 * det.sub + (b.w * det.sub) / 2) * DCELL;
          S.dcam.y = (b.y0 * det.sub + (b.h * det.sub) / 2) * DCELL;
          S.dcam.zoom = clamp(Math.min((DW - 70) / pw, (DH - 70) / ph), 0.05, 4);
          needsDraw = true;
        }
        function setDTool(t) {
          S.dtool = t;
          document.querySelectorAll("#detail-tools .tool").forEach((b) => b.classList.toggle("on", b.dataset.dtool === t));
          dCanvas.style.cursor = t === "pan" ? "grab" : t === "select" ? "default" : "crosshair";
          needsDraw = true;
        }
        function renderTypePalette() {
          $("#detail-types").innerHTML = BOX_TYPES.map(
            (t) => `<button class="ty ${t.id === S.dtype ? "on" : ""}" data-dtype="${t.id}">
                <span class="swatch" style="background:${t.color}"></span>${t.name}</button>`
          ).join("");
        }
        $("#detail-types").addEventListener("click", (e) => {
          const b = e.target.closest("[data-dtype]");
          if (!b) return;
          S.dtype = b.dataset.dtype;
          if (S.dsel) {
            const box = detailData(S.detailRoomId).boxes.find((x) => x.id === S.dsel);
            if (box) { pushUndo(); box.type = S.dtype; commit(); }
          }
          renderTypePalette();
          renderDetailInspector();
          needsDraw = true;
        });
        $("#detail-tools").addEventListener("click", (e) => {
          const b = e.target.closest("[data-dtool]");
          if (b) setDTool(b.dataset.dtool);
        });
        $("#detail-close").onclick = closeDetail;
        $("#detail-fit").onclick = fitDetail;
        $("#detail-sub").onchange = (e) => {
          const det = detailData(S.detailRoomId);
          const next = +e.target.value;
          if (next === det.sub) return;
          pushUndo();
          const f = next / det.sub;
          det.boxes.forEach((b) => {
            b.x = Math.round(b.x * f); b.y = Math.round(b.y * f);
            b.w = Math.max(1, Math.round(b.w * f)); b.h = Math.max(1, Math.round(b.h * f));
          });
          det.sub = next;
          commit();
          fitDetail();
        };

        function drawDetail() {
          const room = roomById(S.detailRoomId);
          if (!room) return;
          const det = detailData(S.detailRoomId);
          const [w, h] = resizeCanvas(dCanvas, dctx);
          DW = w; DH = h;
          const V = makeView(S.dcam, w, h);
          const sub = det.sub, U = DCELL; // one sub-cell = DCELL px at zoom 1
          const z = S.dcam.zoom;

          dctx.fillStyle = "#0e1116";
          dctx.fillRect(0, 0, w, h);

          // in-room floor
          dctx.fillStyle = "#181d26";
          for (const c of room.cells) {
            const [cx, cy] = unck(c);
            dctx.fillRect(V.sx(cx * sub * U), V.sy(cy * sub * U), sub * U * z + 0.5, sub * U * z + 0.5);
          }

          // sub-grid
          const step = U * z;
          const x0 = Math.floor(V.wx(0) / U), x1 = Math.ceil(V.wx(w) / U);
          const y0 = Math.floor(V.wy(0) / U), y1 = Math.ceil(V.wy(h) / U);
          if (step >= 4) {
            dctx.strokeStyle = "#1e2430";
            dctx.lineWidth = 1;
            dctx.beginPath();
            for (let x = x0; x <= x1; x++) {
              if (x % sub === 0) continue;
              const px = Math.round(V.sx(x * U)) + 0.5;
              dctx.moveTo(px, 0); dctx.lineTo(px, h);
            }
            for (let y = y0; y <= y1; y++) {
              if (y % sub === 0) continue;
              const py = Math.round(V.sy(y * U)) + 0.5;
              dctx.moveTo(0, py); dctx.lineTo(w, py);
            }
            dctx.stroke();
          }
          // world-cell grid
          dctx.strokeStyle = "#333e50";
          dctx.beginPath();
          for (let x = Math.ceil(x0 / sub) * sub; x <= x1; x += sub) {
            const px = Math.round(V.sx(x * U)) + 0.5;
            dctx.moveTo(px, 0); dctx.lineTo(px, h);
          }
          for (let y = Math.ceil(y0 / sub) * sub; y <= y1; y += sub) {
            const py = Math.round(V.sy(y * U)) + 0.5;
            dctx.moveTo(0, py); dctx.lineTo(w, py);
          }
          dctx.stroke();

          // room silhouette
          const set = new Set(room.cells);
          dctx.strokeStyle = roomColor(room);
          dctx.lineWidth = 2;
          dctx.beginPath();
          for (const c of room.cells) {
            const [cx, cy] = unck(c);
            const L = V.sx(cx * sub * U), T = V.sy(cy * sub * U);
            const R = V.sx((cx + 1) * sub * U), B = V.sy((cy + 1) * sub * U);
            if (!set.has(ck(cx, cy - 1))) { dctx.moveTo(L, T); dctx.lineTo(R, T); }
            if (!set.has(ck(cx, cy + 1))) { dctx.moveTo(L, B); dctx.lineTo(R, B); }
            if (!set.has(ck(cx - 1, cy))) { dctx.moveTo(L, T); dctx.lineTo(L, B); }
            if (!set.has(ck(cx + 1, cy))) { dctx.moveTo(R, T); dctx.lineTo(R, B); }
          }
          dctx.stroke();

          // doors on the room border, as anchors while greyboxing
          for (const d of S.doc.doors) {
            const cs = edgeCells(d);
            if (!cs.some(([x, y]) => set.has(ck(x, y)))) continue;
            const lock = d.lockId ? lockById(d.lockId) : null;
            const along = sub * U * z * 0.5, thick = clamp(sub * U * z * 0.12, 3, 14);
            const cx = V.sx(d.o === "v" ? d.x * sub * U : (d.x * sub + sub / 2) * U);
            const cy = V.sy(d.o === "v" ? (d.y * sub + sub / 2) * U : d.y * sub * U);
            dctx.fillStyle = lock ? lock.color : "#93a0b4";
            const bw = d.o === "v" ? thick : along, bh = d.o === "v" ? along : thick;
            roundRect(dctx, cx - bw / 2, cy - bh / 2, bw, bh, 2);
            dctx.fill();
          }

          // structures inside the room, as faint reference underlays
          if (S.showStructs) {
            const cs = sub * U * z;
            for (const st of S.doc.structures) {
              dctx.fillStyle = hexA(structColor(st), 0.16);
              for (const c of st.cells) {
                if (!set.has(c)) continue;
                const [cx, cy] = unck(c);
                dctx.fillRect(V.sx(cx * sub * U), V.sy(cy * sub * U), cs + 0.5, cs + 0.5);
              }
            }
            dctx.save();
            dctx.lineCap = "round";
            dctx.lineWidth = clamp(sub * U * z * 0.06, 2, 8);
            for (const es of S.doc.edgeStructs) {
              dctx.strokeStyle = hexA(structColor(es), 0.75);
              dctx.beginPath();
              for (const k of es.edges) {
                const e = unek(k);
                if (!edgeCells(e).some(([x, y]) => set.has(ck(x, y)))) continue;
                const [x0, y0, x1, y1] = edgeEnds(e);
                const f = (sub * U) / CELL;
                dctx.moveTo(V.sx(x0 * f), V.sy(y0 * f));
                dctx.lineTo(V.sx(x1 * f), V.sy(y1 * f));
              }
              dctx.stroke();
            }
            dctx.globalAlpha = 0.55;
            dctx.textAlign = "center";
            dctx.textBaseline = "middle";
            dctx.font = `${Math.max(8, Math.round(cs * 0.5))}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", ${FONTF}`;
            for (const st of S.doc.stamps) {
              for (const c of st.cells) {
                if (!set.has(c)) continue;
                const [cx, cy] = unck(c);
                dctx.fillText(st.emoji, V.sx((cx + 0.5) * sub * U), V.sy((cy + 0.5) * sub * U));
              }
            }
            dctx.restore();
          }

          // boxes
          dctx.textAlign = "center";
          dctx.textBaseline = "middle";
          for (const b of det.boxes) {
            const t = boxType(b.type);
            const px = V.sx(b.x * U), py = V.sy(b.y * U);
            const pw = b.w * U * z, ph = b.h * U * z;
            if (px > w || py > h || px + pw < 0 || py + ph < 0) continue;
            dctx.fillStyle = hexA(t.color, 0.32);
            dctx.fillRect(px, py, pw, ph);
            dctx.strokeStyle = t.color;
            dctx.lineWidth = b.id === S.dsel ? 2.5 : 1.4;
            dctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
            if (b.label && pw > 26 && ph > 12) {
              const fs = clamp(Math.round(11 * Math.min(1.4, z * 1.4)), 9, 15);
              dctx.font = `500 ${fs}px ${FONTF}`;
              dctx.fillStyle = shade(t.color, 0.35);
              dctx.fillText(b.label, px + pw / 2, py + ph / 2);
            }
            if (b.id === S.dsel) {
              dctx.fillStyle = "#ffffff";
              dctx.fillRect(px + pw - 5, py + ph - 5, 9, 9);
              dctx.strokeStyle = "#0e1116";
              dctx.lineWidth = 1;
              dctx.strokeRect(px + pw - 5.5, py + ph - 5.5, 10, 10);
            }
          }

          // drag preview
          if (S.ddrag && S.ddrag.type === "box") {
            const r = normRect(S.ddrag.a, S.ddrag.b);
            const t = boxType(S.dtype);
            dctx.fillStyle = hexA(t.color, 0.22);
            dctx.strokeStyle = t.color;
            dctx.lineWidth = 1.5;
            dctx.fillRect(V.sx(r.x * U), V.sy(r.y * U), r.w * U * z, r.h * U * z);
            dctx.strokeRect(V.sx(r.x * U) + 0.5, V.sy(r.y * U) + 0.5, r.w * U * z - 1, r.h * U * z - 1);
          }
        }

        function normRect(a, b) {
          const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
          return { x, y, w: Math.abs(b.x - a.x) + 1, h: Math.abs(b.y - a.y) + 1 };
        }
        function dEvPos(e) {
          const r = dCanvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
        function dSubAt(V, p) {
          return { x: Math.floor(V.wx(p.x) / DCELL), y: Math.floor(V.wy(p.y) / DCELL) };
        }
        function boxAt(det, sx, sy) {
          for (let i = det.boxes.length - 1; i >= 0; i--) {
            const b = det.boxes[i];
            if (sx >= b.x && sx < b.x + b.w && sy >= b.y && sy < b.y + b.h) return b;
          }
          return null;
        }

        dCanvas.addEventListener("pointerdown", (e) => {
          const V = makeView(S.dcam, DW, DH);
          const p = dEvPos(e);
          const s = dSubAt(V, p);
          const det = detailData(S.detailRoomId);

          const rmb = e.button === 2;
          if (e.button === 1 || S.spaceDown || S.dtool === "pan" || (rmb && S.rclick === "pan")) {
            dCanvas.setPointerCapture(e.pointerId);
            S.ddrag = { type: "pan", last: p };
            return;
          }
          if (e.button > 2) return;
          dCanvas.setPointerCapture(e.pointerId);

          if (S.dtool === "box" && !rmb) {
            S.ddrag = { type: "box", a: s, b: s };
            needsDraw = true;
            return;
          }
          if (S.dtool === "erase" || rmb) {
            const b = boxAt(det, s.x, s.y);
            if (b) {
              pushUndo();
              det.boxes = det.boxes.filter((x) => x !== b);
              if (S.dsel === b.id) S.dsel = null;
              commit();
              renderDetailInspector();
            }
            S.ddrag = { type: "erase" };
            return;
          }
          if (S.dtool === "select") {
            const sel = det.boxes.find((x) => x.id === S.dsel);
            if (sel) {
              // bottom-right resize handle, in screen space
              const hx = V.sx((sel.x + sel.w) * DCELL), hy = V.sy((sel.y + sel.h) * DCELL);
              if (Math.abs(p.x - hx) < 9 && Math.abs(p.y - hy) < 9) {
                S.ddrag = { type: "resize", box: sel, undone: false };
                return;
              }
            }
            const b = boxAt(det, s.x, s.y);
            S.dsel = b ? b.id : null;
            if (b) S.ddrag = { type: "movebox", box: b, start: s, ox: b.x, oy: b.y, undone: false };
            renderDetailInspector();
            needsDraw = true;
          }
        });

        dCanvas.addEventListener("pointermove", (e) => {
          const V = makeView(S.dcam, DW, DH);
          const p = dEvPos(e);
          const s = dSubAt(V, p);
          const det = detailData(S.detailRoomId);
          const d = S.ddrag;
          if (!d) return;

          if (d.type === "pan") {
            S.dcam.x -= (p.x - d.last.x) / S.dcam.zoom;
            S.dcam.y -= (p.y - d.last.y) / S.dcam.zoom;
            d.last = p;
            needsDraw = true;
          } else if (d.type === "box") {
            d.b = s;
            needsDraw = true;
          } else if (d.type === "erase") {
            const b = boxAt(det, s.x, s.y);
            if (b) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              det.boxes = det.boxes.filter((x) => x !== b);
              commit();
            }
          } else if (d.type === "movebox") {
            const nx = d.ox + (s.x - d.start.x), ny = d.oy + (s.y - d.start.y);
            if (nx !== d.box.x || ny !== d.box.y) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              d.box.x = nx; d.box.y = ny;
              needsDraw = true;
              scheduleSave();
            }
          } else if (d.type === "resize") {
            const nw = Math.max(1, s.x - d.box.x + 1), nh = Math.max(1, s.y - d.box.y + 1);
            if (nw !== d.box.w || nh !== d.box.h) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              d.box.w = nw; d.box.h = nh;
              needsDraw = true;
              scheduleSave();
            }
          }
        });

        function endDDrag() {
          const d = S.ddrag;
          if (!d) return;
          if (d.type === "box") {
            const r = normRect(d.a, d.b);
            pushUndo();
            const box = { id: uid("box"), x: r.x, y: r.y, w: r.w, h: r.h, type: S.dtype, label: "" };
            detailData(S.detailRoomId).boxes.push(box);
            S.dsel = box.id;
            commit();
            renderDetailInspector();
          }
          S.ddrag = null;
          needsDraw = true;
          flushUI();
        }
        dCanvas.addEventListener("pointerup", endDDrag);
        dCanvas.addEventListener("pointercancel", endDDrag);
        dCanvas.addEventListener("contextmenu", (e) => e.preventDefault());
        dCanvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const V = makeView(S.dcam, DW, DH);
            const p = dEvPos(e);
            zoomAt(S.dcam, p.x, p.y, Math.pow(0.999, e.deltaY), V);
            needsDraw = true;
          },
          { passive: false }
        );

        const DTOOL_KEYS = { b: "box", v: "select", e: "erase", h: "pan" };
        function detailKey(e) {
          if (e.key === "Escape") { S.dsel ? ((S.dsel = null), renderDetailInspector(), (needsDraw = true)) : closeDetail(); return; }
          if (e.key === "f") { fitDetail(); return; }
          const t = DTOOL_KEYS[e.key.toLowerCase()];
          if (t) { setDTool(t); return; }
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= 9 && BOX_TYPES[n - 1]) {
            S.dtype = BOX_TYPES[n - 1].id;
            renderTypePalette();
            needsDraw = true;
            return;
          }
          if (e.key === "Delete" || e.key === "Backspace") {
            if (!S.dsel) return;
            pushUndo();
            const det = detailData(S.detailRoomId);
            det.boxes = det.boxes.filter((b) => b.id !== S.dsel);
            S.dsel = null;
            commit();
            renderDetailInspector();
          }
        }

        function renderDetailInspector() {
          const host = $("#detail-inspector");
          if (!S.dsel || !S.detailRoomId) { host.hidden = true; return; }
          const det = detailData(S.detailRoomId);
          const b = det.boxes.find((x) => x.id === S.dsel);
          if (!b) { host.hidden = true; return; }
          host.hidden = false;
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${boxType(b.type).color}"></span>
              <span class="kind">${esc(boxType(b.type).name)}</span></div>
            <div class="fld"><label>Type</label><select id="d-type">${BOX_TYPES.map(
              (t) => `<option value="${t.id}" ${t.id === b.type ? "selected" : ""}>${t.name}</option>`
            ).join("")}</select></div>
            <div class="fld"><label>Label</label><input type="text" id="d-label" value="${esc(b.label)}" placeholder="optional" /></div>
            <div class="meta">${b.w}×${b.h} sub-cells at ${b.x}, ${b.y}</div>
            <div class="btn-row"><button class="btn danger" id="d-del">Delete</button></div>`;
          $("#d-type").onchange = (e) => {
            pushUndo(); b.type = e.target.value; S.dtype = b.type;
            renderTypePalette(); commit(); renderDetailInspector();
          };
          $("#d-label").oninput = (e) => { b.label = e.target.value; needsDraw = true; scheduleSave(); };
          undoOnFocus($("#d-label"));
          $("#d-del").onclick = () => {
            pushUndo();
            det.boxes = det.boxes.filter((x) => x.id !== b.id);
            S.dsel = null;
            commit();
            renderDetailInspector();
          };
        }

        /* ══════════════════════════════════════════════════════════════
           15 · Import / export
           ══════════════════════════════════════════════════════════════ */
        function exportJSON() {
          S.doc.updated = Date.now();
          const blob = new Blob([JSON.stringify(S.doc, null, 2)], { type: "application/json" });
          saveBlob(blob, slug(S.doc.name) + ".mvmap.json");
        }
        $("#btn-export").onclick = exportJSON;
        $("#btn-import").onclick = () => $("#file-input").click();
        $("#file-input").onchange = (e) => {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            try {
              const d = migrate(JSON.parse(rd.result));
              d.id = uid("map"); // import as a new map, never clobber
              loadDoc(d);
            } catch (err) {
              alert("Could not read that file: " + err.message);
            }
          };
          rd.readAsText(f);
          e.target.value = "";
        };

        function exportPNG() {
          const b = docBBox();
          if (!b) { alert("Nothing to export yet."); return; }
          const pad = 1;
          const cols = b.x1 - b.x0 + 1 + pad * 2, rows = b.y1 - b.y0 + 1 + pad * 2;
          const scale = clamp(Math.floor(4096 / Math.max(cols, rows)), 8, 48);
          const w = cols * scale, h = rows * scale;
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const cx = c.getContext("2d");
          const cam = {
            x: (b.x0 - pad + cols / 2) * CELL,
            y: (b.y0 - pad + rows / 2) * CELL,
            zoom: scale / CELL,
          };
          drawWorld(cx, makeView(cam, w, h), { cursor: false, bg: "#12151b", labels: S.showLabels });
          c.toBlob((blob) => saveBlob(blob, slug(S.doc.name) + ".png"), "image/png");
        }
        $("#btn-png").onclick = exportPNG;

        /* ══════════════════════════════════════════════════════════════
           16 · Documents
           ══════════════════════════════════════════════════════════════ */
        function loadDoc(d) {
          S.doc = migrate(d);
          S.sel = null;
          S.activeRoomId = null;
          S.activeStructId = null;
          S.activeEdgeId = null;
          S.activeStampId = null;
          S.activeAreaId = S.doc.areas[0].id;
          undoStack.length = 0;
          redoStack.length = 0;
          closeDetail();
          $("#map-name").value = S.doc.name;
          commit();
          fitWorld();
        }
        $("#btn-new").onclick = () => {
          if ((S.doc.rooms.length || S.doc.structures.length || S.doc.edgeStructs.length) && !confirm("Start a new map? The current one stays saved in your library.")) return;
          loadDoc(newDoc());
        };

        /* ══════════════════════════════════════════════════════════════
           17 · Modals
           ══════════════════════════════════════════════════════════════ */
        function openModal(html) {
          $("#modal-box").innerHTML = html;
          $("#modal").hidden = false;
        }
        function closeModal() {
          $("#modal").hidden = true;
          rebinding = null;
        }
        $("#modal").addEventListener("click", (e) => {
          if (e.target.id === "modal" || e.target.dataset.close != null) closeModal();
        });

        $("#btn-help").onclick = () => {
          openModal(`
            <h2>MVMap — Metroidvania Map Editor</h2>
            <p>A tool for laying out metroidvania worlds: paint rooms onto grid paper, colour them by area,
               connect them with doors, and model progression with locks and keys.</p>
            <h3>Rooms</h3>
            <p>Press <b>+</b> above the room list to open a new room in the active area, then drag on the grid
               to paint its cells — a room is any set of cells, so L-shapes and corridors are fine.
               <b>Shift</b>+paint also starts a new room without leaving the canvas. Adding an area opens a
               room in it automatically.</p>
            <h3>Locks &amp; keys</h3>
            <p>The core metroidvania principle is that the map is non-linear and gated. New areas are
               <em>locked</em>, and the player must find a <em>key</em> elsewhere to get through. A key is rarely a
               literal key — it's a movement ability, an item, or a story beat. One lock can have several keys,
               and one key can open many locks.</p>
            <p>Place a door on a cell edge, assign it a lock, then tick which keys open that lock. Selecting a
               lock or key draws the links between them, so you can read the progression flow at a glance.
               A lock with doors but no keys is flagged as a soft-lock.</p>
            <h3>Structures</h3>
            <p>A <b>structure</b> is a named, coloured set of cells drawn on a layer above the rooms — walls,
               breakable or hidden walls, mechanisms, switches. Paint them with <b>S-Paint</b> or drag a box with
               <b>S-Rect</b>; <b>Shift</b> starts a new structure, <b>Alt</b> erases. Painting a structure never
               changes the room underneath, and moving a room carries its structures along.</p>
            <p>An <b>edge structure</b> lives on the grid lines instead of in cells, drawn as a thick bar — use it
               for platforms and ledges. With the <b>Edge</b> tool, drag along a grid line to lay a straight run of
               edges, or click a single edge. <b>Shift</b> starts a new one, <b>Alt</b> removes edges.</p>
            <h3>Stamps</h3>
            <p>A <b>stamp</b> drops one emoji onto a single cell, on the very top layer — save points, items,
               bosses, shops. Like structures, each stamp has a name, colour and notes, and you can keep many of
               them; pick the emoji from the inspector's palette or type one — the field holds exactly one emoji. Click with the <b>Stamp</b> tool
               to place the active one, <b>Shift</b>-click to start a new stamp, <b>Alt</b>-click to remove one.
               Drag a placed stamp with <b>Select</b> to move just that cell.</p>
            <h3>Notes</h3>
            <p>A <b>note</b> is a standalone annotation pinned to one cell, drawn above everything else. Click a
               cell with the <b>Note</b> tool to add one, then write its details in the Inspector. The <b>+</b>
               button on the note (or <b>Enter</b> while it's selected) expands it into a translucent text box on
               the map; the box's <b>−</b> button collapses it again. The label under the note can be hidden with
               <b>Show name on map</b>. Notes have no list of their own — <b>Alt</b>-click, right-click remove or
               <b>Del</b> deletes one, and <b>Show notes</b> hides them all. They are separate from the notes field
               on rooms and structures.</p>
            <h3>Right-click</h3>
            <p>Choose what the right mouse button does under <b>Right-click</b> at the bottom of the left panel.
               <b>Remove</b> works like holding <b>Alt</b> with the current tool — erase cells, clear structure
               cells or edges, delete a door, key or stamp; with <b>Select</b> it removes the smallest thing under
               the pointer, and in grey-box it erases boxes. <b>Hold &amp; drag to pan</b> turns it into a pan
               button instead. The choice is remembered in this browser.</p>
            <h3>Names &amp; order</h3>
            <p>Every inspector has <b>Show name on map</b> to hide one object's label, and <b>Order</b> buttons
               to move the selection up or down its list (rooms reorder within their area). Lists draw in order,
               so later entries paint over earlier ones.</p>
            <h3>Grey-boxing a room</h3>
            <p>Double-click any room (or press <b>Enter</b> with it selected) to open a subdivided grid for that
               room, and block out its interior with typed boxes — solid, platform, hazard, water, ladder, exit,
               item, enemy, note. Doors on the room's border are drawn as anchors.</p>
            <h3>Storage</h3>
            <p>Maps autosave to your browser (IndexedDB, or localStorage when that isn't available). Use
               <b>Export</b> for a portable <code>.json</code> file and <b>PNG</b> for an image of the whole map.</p>
            <h3>Tool shortcuts</h3>
            <p>Click a key, then press the new one. Taking a key another tool already uses swaps the two.
               Modifier combinations and the reserved keys — Space, F, Enter, Esc, Del, Backspace, [ ] and Tab —
               can't be bound. Holding <b>Space</b> always pans. Shortcuts are saved in this browser; use
               Export / Import to move them to another one.</p>
            <div class="keymap" id="keymap"></div>
            <div class="meta km-msg" id="km-msg"></div>
            <div class="btn-row" style="margin-top:4px">
              <button class="btn" id="km-import">Import…</button>
              <button class="btn" id="km-export">Export</button>
              <button class="btn" id="km-reset">Reset to defaults</button>
            </div>
            <h3>Map shortcuts</h3>
            <div class="kbd-grid">
              <b>Space (hold)</b><span>Pan</span>
              <b>Shift + paint</b><span>Start a new room / structure</span>
              <b>Alt + paint</b><span>Erase instead</span>
              <b>Right-click</b><span>Remove, or drag to pan (configurable)</span>
              <b>F</b><span>Zoom to fit</span>
              <b>Enter</b><span>Grey-box selected room · expand / collapse selected note</span>
              <b>Del</b><span>Delete selection</span>
              <b>[ / ]</b><span>Move selection up / down its list</span>
              <b>Shift + [ / ]</b><span>Move selection to top / bottom</span>
              <b>Ctrl + Z / Y</b><span>Undo / redo</span>
              <b>Ctrl + S</b><span>Export JSON</span>
            </div>
            <h3>Grey-box shortcuts</h3>
            <div class="kbd-grid">
              <b>B</b><span>Draw box</span>
              <b>V</b><span>Select / move / resize</span>
              <b>E</b><span>Erase box</span>
              <b>1–9</b><span>Pick box type</span>
              <b>Esc</b><span>Deselect, then back to map</span>
            </div>
            <div class="close-row"><button class="btn primary" data-close style="flex:0 0 auto;padding:6px 16px">Close</button></div>`);
          renderKeymap();
          $("#km-export").onclick = exportKeymap;
          $("#km-import").onclick = () => $("#keys-input").click();
          $("#km-reset").onclick = () => {
            rebinding = null;
            applyToolKeys(DEFAULT_TOOL_KEYS);
            saveToolKeys();
            renderKeymap("Shortcuts reset to defaults.");
          };
        };

        /* ── Keymap editor (inside the help modal) ─────────────────── */
        let rebinding = null; // tool id waiting for its new key
        function renderKeymap(msg, isErr) {
          const host = $("#keymap");
          if (!host) return;
          host.innerHTML = TOOL_LIST.map(
            (t) => `<div class="km-row"><span>${esc(t.name)}${t.id === "pan" ? " <span class=\"sub\">(+ hold Space)</span>" : ""}</span>
                <button class="keycap ${rebinding === t.id ? "wait" : ""}" data-rebind="${t.id}">${
                  rebinding === t.id ? "press a key…" : esc(keyLabel(toolKeys[t.id]))
                }</button></div>`
          ).join("");
          host.querySelectorAll("[data-rebind]").forEach((b) => {
            b.onclick = () => {
              rebinding = rebinding === b.dataset.rebind ? null : b.dataset.rebind;
              renderKeymap(rebinding ? `Press the new key for ${toolName(rebinding)} — Esc cancels.` : "");
              // keep Space/Enter from re-clicking the button while it waits for a key
              if (document.activeElement) document.activeElement.blur();
            };
          });
          const m = $("#km-msg");
          if (m && msg !== undefined) {
            m.textContent = msg;
            m.classList.toggle("err", !!isErr);
          }
        }
        // capture phase, so a key being bound never reaches the editor's own shortcuts
        window.addEventListener(
          "keydown",
          (e) => {
            if (!rebinding || $("#modal").hidden) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            if (["Shift", "Control", "Alt", "Meta", "CapsLock", "AltGraph"].includes(e.key)) return;
            if (e.key === "Escape") {
              rebinding = null;
              renderKeymap("Cancelled.");
              return;
            }
            if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) {
              renderKeymap("Modifier combinations aren't supported — press a single key.", true);
              return;
            }
            const k = normKey(e.key);
            const bad = keyProblem(k);
            if (bad) {
              renderKeymap(bad + " Try another key, or Esc to cancel.", true);
              return;
            }
            const tool = rebinding;
            const old = toolKeys[tool];
            const other = TOOL_KEYS[k];
            const next = Object.assign({}, toolKeys, { [tool]: k });
            let msg = `${toolName(tool)} is now ${keyLabel(k)}.`;
            if (other && other !== tool) {
              next[other] = old;
              msg = `${toolName(tool)} is now ${keyLabel(k)}; ${toolName(other)} took ${keyLabel(old)} (swapped).`;
            }
            rebinding = null;
            applyToolKeys(next);
            saveToolKeys();
            renderKeymap(msg);
            const cap = $(`#keymap [data-rebind="${tool}"]`);
            if (cap) cap.classList.add("flash");
          },
          true
        );
        function exportKeymap() {
          const out = { type: "mvmap-shortcuts", version: 1, keys: toolKeys };
          saveBlob(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }), "mvmap-shortcuts.json");
          renderKeymap("Exported mvmap-shortcuts.json.");
        }
        $("#keys-input").onchange = (e) => {
          const f = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            let map;
            try {
              map = readKeymap(JSON.parse(rd.result));
            } catch (err) {
              renderKeymap("Could not read that file: " + err.message, true);
              return;
            }
            const bad = keymapProblem(map);
            if (bad) {
              renderKeymap("Not imported — " + bad, true);
              return;
            }
            rebinding = null;
            applyToolKeys(map);
            saveToolKeys();
            renderKeymap("Shortcuts imported from " + f.name + ".");
          };
          rd.readAsText(f);
        };

        $("#btn-maps").onclick = async () => {
          const all = (await Store.all()).sort((a, b) => (b.updated || 0) - (a.updated || 0));
          const rows = all.length
            ? all
                .map((d) => {
                  const when = d.updated ? new Date(d.updated).toLocaleString() : "—";
                  return `<div class="map-row">
                      <span class="nm"><b>${esc(d.name || "Untitled")}</b>${
                    d.id === S.doc.id ? ' <span class="sub">— open</span>' : ""
                  }<br /><span class="sub">${(d.rooms || []).length} rooms · ${(d.structures || []).length + (d.edgeStructs || []).length} structures · ${(d.locks || []).length} locks · ${when}</span></span>
                      <button class="btn" data-open="${d.id}" style="flex:0 0 auto;padding:4px 12px">Open</button>
                      <button class="btn danger" data-delmap="${d.id}" style="flex:0 0 auto;padding:4px 12px">Delete</button>
                    </div>`;
                })
                .join("")
            : `<p>No saved maps yet.</p>`;
          openModal(`<h2>Saved maps</h2><p class="sub">Stored via ${
            Store.mode === "idb" ? "IndexedDB" : "localStorage"
          }.</p>${rows}<div class="close-row"><button class="btn primary" data-close style="flex:0 0 auto;padding:6px 16px">Close</button></div>`);

          $("#modal-box").querySelectorAll("[data-open]").forEach((b) => {
            b.onclick = () => {
              const d = all.find((x) => x.id === b.dataset.open);
              if (d) { loadDoc(d); closeModal(); }
            };
          });
          $("#modal-box").querySelectorAll("[data-delmap]").forEach((b) => {
            b.onclick = async () => {
              const id = b.dataset.delmap;
              const d = all.find((x) => x.id === id);
              if (!confirm(`Delete “${d ? d.name : "this map"}” permanently?`)) return;
              await Store.del(id);
              closeModal();
              if (id === S.doc.id) loadDoc(newDoc());
            };
          });
        };

        /* ══════════════════════════════════════════════════════════════
           18 · Boot
           ══════════════════════════════════════════════════════════════ */
        (async function boot() {
          await Store.init();
          if (Store.mode !== "idb") $("#file-note").classList.add("show");

          let doc = null;
          try {
            const lastId = localStorage.getItem("mvmap:last");
            if (lastId) {
              const all = await Store.all();
              doc = all.find((d) => d.id === lastId) || null;
            }
          } catch (e) {}

          S.doc = migrate(doc || newDoc());
          S.activeAreaId = S.doc.areas[0].id;
          $("#map-name").value = S.doc.name;
          $("#chk-flow").checked = S.showFlow;
          $("#chk-labels").checked = S.showLabels;
          $("#chk-structs").checked = S.showStructs;
          $("#chk-slabels").checked = S.showStructLabels;
          $("#chk-notes").checked = S.showNotes;
          try { if (localStorage.getItem("mvmap:rclick") === "pan") S.rclick = "pan"; } catch (e) {}
          $("#sel-rclick").value = S.rclick;
          loadToolKeys();
          setTool("paint");
          setDTool("box");
          renderTypePalette();
          reindex();
          renderUI();
          setStatus("saved");

          const [w, h] = resizeCanvas(worldCanvas, wctx);
          VW = w; VH = h;
          if (docBBox()) fitWorld();
          needsDraw = true;
          requestAnimationFrame(frame);
        })();
      })();
    </script>
  </body>
</html>
